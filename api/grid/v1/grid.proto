  string agency = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"Calaveras SO / CAL FIRE\""}];
  // Listening page on Broadcastify.
  string broadcastify_url = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    format: "uri"
    example: "\"https://www.broadcastify.com/listen/feed/13524\""
  }];
}

// ScannerList is the scanner feeds.
message ScannerList {
  // Feeds, in configuration order.
  repeated Scanner scanners = 1;
}

// ListCamerasRequest optionally scopes the camera list.
message ListCamerasRequest {
  // Only cameras within 25 km of this place (slug or id), nearest first.
  // Default: every camera near any coverage area.
  string place = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"sonora\""}];
}

// Camera is one Caltrans CCTV camera. Every listed camera is in service and has
// an image; an out-of-service camera is dropped, not flagged.
message Camera {
  // Camera id, `d{district}-{index}`.
  string id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"d10-172\""}];
  // Caltrans's camera name.
  string name = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"EB 108 W/O Soulsbyville Rd\""}];
  // Nearest community, per Caltrans.
  string nearby_place = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"Soulsbyville\""}];
  // County, per Caltrans.
  string county = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"Tuolumne\""}];
  // Route, e.g. "SR-108", "US-395".
  string route = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"SR-108\""}];
  // Direction the camera faces along the route. Empty string when not given.
  string direction = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    example: "\"East\""
    enum: ["", "North", "South", "East", "West"]
  }];
  // Camera position.
  LatLng location = 7 [(google.api.field_behavior) = REQUIRED];
  // Elevation in feet.
  int32 elevation_feet = 8 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "2650"}];
  // Current snapshot JPEG, hosted by Caltrans (cwwp2.dot.ca.gov).
  string image_url = 9 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {format: "uri"}];
  // How often Caltrans replaces the snapshot, in minutes. 0 when not reported.
  int32 image_refresh_minutes = 10 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "5"}];
  // HLS playlist (.m3u8) for live video. Empty string for an image-only camera.
  string stream_url = 11 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {format: "uri"}];
  // Caltrans's note on the view, e.g. "Looking South". Usually an empty string.
  string description = 12;
  // Metres from the requested place, or, without `place`, from the nearest
  // coverage area. 0 means inside it.
  int32 distance_meters = 13 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "1200"}];
}

// CameraList is the camera directory.
message CameraList {
  // Cameras, nearest first, then by id. Empty when none is nearby.
  repeated Camera cameras = 1;
  // Health of the camera list. STALE: served from an older fetch, or a
  // configured district is missing. UNAVAILABLE: no list fetched yet, or no
  // camera districts configured.
  string source_status = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    example: "\"OK\""
    enum: ["OK", "STALE", "UNAVAILABLE"]
  }];
  // When the served list was fetched. `null` when `sourceStatus` is OK.
  google.protobuf.Timestamp last_source_update = 3;
  // Attribution to display.
  string attribution = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"Caltrans\""}];
}

// GetConditionsRequest optionally scopes the conditions.
message GetConditionsRequest {
  // Only weather locations inside this place's bounding box (slug or id). Does
  // not filter `fireWeather`.
  string place = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"calaveras-county\""}];
}

// WeatherConditions is current weather at one location, from OpenWeatherMap.
// Whole numbers, metric units. A value that could not be read is 0.
message WeatherConditions {
  // Location id; joins to `WeatherForecast.locationId`.
  string location_id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"murphys\""}];
  // Display name.
  string location_name = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"Murphys, CA\""}];
  // OpenWeatherMap condition group: "Clear", "Clouds", "Rain", "Snow",
  // "Thunderstorm", "Drizzle", "Mist", ...
  string weather_main = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"Clear\""}];
  // OpenWeatherMap description, lowercase, e.g. "clear sky".
  string weather_description = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"clear sky\""}];
  // OpenWeatherMap icon code; the image is
  // `https://openweathermap.org/img/wn/{icon}@2x.png`.
  string weather_icon = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"01n\""}];
  // Air temperature, degrees Celsius.
  int32 temperature_celsius = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "10"}];
  // Feels-like temperature, degrees Celsius.
  int32 feels_like_celsius = 7 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "9"}];
  // Relative humidity, percent.
  int32 humidity_percent = 8 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "75"}];
  // Wind speed, km/h.
  int32 wind_speed_kmh = 9 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "7"}];
  // Direction the wind blows FROM, degrees clockwise from north.
  int32 wind_direction_degrees = 10 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "30"}];
  // Visibility, km (OpenWeatherMap caps it at 10).
  int32 visibility_km = 11 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "10"}];
}

// FireWeatherConditions is the region's fire-weather state, from issued NWS
// products only. It never claims a Red Flag Warning that NWS has not issued.
message FireWeatherConditions {
  // LOWERCASE state: `normal`, `elevated` (a Fire Weather Watch is in effect)
  // or `red-flag` (a Red Flag Warning is in effect). Empty string when the
  // state could not be determined.
  string state = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    example: "\"normal\""
    enum: ["normal", "elevated", "red-flag", ""]
  }];
  // The NWS product's headline. Empty string when the state is normal.
  string headline = 2;
  // NWS fire-weather zones under the product. Empty when normal.
  repeated string zones = 3;
}

// ForecastPeriod is one hour of a location's forecast (NWS gridpoint data),
// rounded to whole numbers. A value NWS did not give is 0.
message ForecastPeriod {
  // Start of the hour, UTC.
  google.protobuf.Timestamp time = 1;
  // Temperature, degrees Celsius.
  int32 temperature_celsius = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "12"}];
  // Relative humidity, percent.
  int32 humidity_percent = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "64"}];
  // Sustained wind speed, km/h.
  int32 wind_speed_kmh = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "6"}];
  // Direction the wind blows FROM, degrees clockwise from north.
  int32 wind_direction_degrees = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "80"}];
  // Wind gust, km/h.
  int32 wind_gust_kmh = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "13"}];
  // The fields below are `null` when NWS gave no value for the hour, never 0:
  // a forecast 0% chance of rain and no forecast are different statements.
  //
  // Probability of precipitation, percent.
  google.protobuf.Int32Value precipitation_probability_percent = 7;
  // Liquid-equivalent precipitation in this hour, mm. NWS forecasts amounts
  // over spans (usually 6 hours); each hour carries an equal share, so sum the
  // hours for a total.
  google.protobuf.DoubleValue precipitation_mm = 8;
  // Snowfall in this hour, mm of snow (not liquid), shared out the same way.
  google.protobuf.DoubleValue snowfall_mm = 9;
  // Snow level: the elevation above which precipitation falls as snow,
  // metres above sea level.
  google.protobuf.Int32Value snow_level_meters = 10;
  // Sky cover, percent.
  google.protobuf.Int32Value sky_cover_percent = 11;
  // The forecast weather in words, from NWS's grid vocabulary, e.g. "Chance
  // of light rain showers"; several are joined with "; ". Empty when NWS
  // forecasts none.
  string weather = 12 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"Chance of light rain showers\""}];
}

// DailyForecastPeriod is one of NWS's named 12-hour forecast periods
// ("Tonight", "Wednesday") for a location's grid cell.
message DailyForecastPeriod {
  // NWS's name for the period.
  string name = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"Wednesday Night\""}];
  google.protobuf.Timestamp start = 2;
  google.protobuf.Timestamp end = 3;
  // Day (high) or night (low) period.
  bool is_daytime = 4;
  // The period's high (day) or low (night), degrees Celsius.
  int32 temperature_celsius = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "8"}];
  // Probability of precipitation, percent. `null` when NWS gave none.
  google.protobuf.Int32Value precipitation_probability_percent = 6;
  // NWS's wind text, e.g. "5 to 10 km/h".
  string wind_speed = 7;
  // Compass point the wind blows from, e.g. "SW".
  string wind_direction = 8;
  // NWS's short forecast, e.g. "Chance Rain Showers".
  string short_forecast = 9 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"Chance Rain Showers\""}];
  // NWS's full sentence forecast.
  string detailed_forecast = 10;
}

// WeatherLocation is one monitored town.
message WeatherLocation {
  // Joins to `WeatherConditions.locationId` and `WeatherForecast.locationId`.
  string id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"arnold\""}];
  string name = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"Arnold, CA\""}];
  double latitude = 3;
  double longitude = 4;
  // Ground elevation at the location, metres (USGS 3DEP). `null` when not
  // configured.
  google.protobuf.Int32Value elevation_meters = 5;
  // The NWS public forecast zone containing it, e.g. `CAZ138`.
  string zone = 6;
}

// WeatherForecast is a location's short-range forecast: the hourly NWS gridpoint
// series (wind, gust, humidity, temperature) plus an at-a-glance summary.
// Informational only: it never implies a fire-weather warning (issued products
// are in `fireWeather`).
//
// (-- See docs/design/fire-weather-forecast-design.md. --)
message WeatherForecast {
  // Location id; joins to `WeatherConditions.locationId`.
  string location_id = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"murphys\""}];
  // Data source and NWS grid cell.
  string source = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"NWS (STO 73,42)\""}];
  // When NWS last updated the grid. Can be `null`.
  google.protobuf.Timestamp issued_at = 3;
  // Hours covered by `periods`.
  int32 horizon_hours = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "48"}];
  // Hourly periods, in time order.
  repeated ForecastPeriod periods = 5;
  // Highest wind gust over the horizon, km/h.
  int32 peak_wind_gust_kmh = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "17"}];
  // When that peak gust is forecast. Can be `null`.
  google.protobuf.Timestamp peak_wind_gust_at = 7;
  // Lowest relative humidity over the horizon, percent. 0 when NWS gave none.
  int32 min_humidity_percent = 8 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "33"}];
  // Elevation of the NWS grid cell this forecast is for, metres. It can
  // differ from the town's own elevation by hundreds of metres. `null` when
  // NWS gave none.
  google.protobuf.Int32Value grid_elevation_meters = 9;
  // The 7-day forecast in NWS's named 12-hour periods, in time order. Empty
  // when that product could not be fetched.
  repeated DailyForecastPeriod daily = 10;
}

// Conditions is current, non-event state.
message Conditions {
  // Current weather per location.
  repeated WeatherConditions weather = 1;
  // The region's fire-weather state. Region-wide, whatever `place` was asked.
  // Can be `null` when the weather service has no fire-weather reading.
  FireWeatherConditions fire_weather = 2;
  // When the weather data was last refreshed.
  google.protobuf.Timestamp last_updated = 3;
  // Per-location forecasts, joined by `locationId`. Every location in
  // `locations` whose forecast is available, whether or not its current
  // `weather` could be read. A location whose forecast could not be fetched
  // is simply missing here.
  repeated WeatherForecast forecast = 4;
  // The monitored towns (within `place`, when given), with position and
  // elevation, in configuration order.
  repeated WeatherLocation locations = 5;
}

// ListSourcesRequest takes no parameters.
message ListSourcesRequest {}

// GetStatsRequest optionally narrows the totals to one place.
message GetStatsRequest {
  // A place slug (`ebbetts-pass`) or id (`area:ebbetts-pass`). Empty: every
  // event the Grid holds.
  string place = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"ebbetts-pass\""}];
}

// Stats is what the Grid has recorded, overall and per layer.
message Stats {
  // The resolved place id, or empty for every event.
  string place = 1;
  // Events ever stored, in every status.
  // (int32 so JSON carries a number, not a string.)
  int32 events = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "18233"}];
  // Revisions recorded across those events (each event's `revision` summed).
  int32 revisions = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "96410"}];
  // Distinct sources those events came from.
  int32 sources = 4;
  // When the earliest of those events was first stored. Null when there are
  // none.
  google.protobuf.Timestamp since = 5;
  // Per-layer totals, largest event count first. Layers with no events are
  // left out.
  repeated LayerStats layers = 6;
  // When these totals were computed (they are cached for up to five minutes).
  google.protobuf.Timestamp computed_at = 7 [(google.api.field_behavior) = REQUIRED];
}

// LayerStats is one layer's share of Stats.
message LayerStats {
  Layer layer = 1;
  int32 events = 2;
  int32 revisions = 3;
}
