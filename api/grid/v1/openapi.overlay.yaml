# Hand-written half of the OpenAPI document served at /api/openapi.json.
#
# grid.proto describes the GridService RPCs; protoc-gen-openapiv2 turns that into
# grid.swagger.json. This file describes everything the generator cannot see.
# cmd/openapi-merge converts the generated file to OpenAPI 3.0, merges this file
# in, validates the result and writes openapi.json (committed, embedded, served).
#
#   make openapi   # after editing this file
#   make proto     # after editing grid.proto (runs openapi-merge too)
#
# Two sections, which differ only in who wins a collision with generated content
# (rules in internal/openapispec/merge.go):
#
#   spec:      content this file OWNS: the hand-built routes, their schemas, the
#              shared responses, the security scheme. A path or named component
#              the generator also emits is a build ERROR, so a route that moves
#              into grid.proto cannot be described twice.
#   defaults:  annotations on GENERATED content (an error example on an RPC,
#              codeName on google.rpc.Status). The generated value wins wherever
#              it exists, so richer proto comments take over without an edit
#              here; openapi-merge prints which defaults became unused.
#              Annotating a path, operation or schema the generator no longer
#              emits is a build ERROR.
#
# OpenAPI 3.0.3 throughout: generated schemas are #/components/schemas/<name>.
# Examples are real production responses (trimmed) unless their summary says
# "Illustrative"; kin-openapi validates each one against its schema.
# TestHandBuiltRoutesAreDocumented (cmd/server) fails CI when a route is mounted
# by hand without a path here.

defaults:
  info:
    title: The Grid API
    version: v1
  # Public and keyless: no auth unless an operation says otherwise (only ingest does).
  security: []

  components:
    schemas:
      rpcStatus:
        description: |
          The error body of every JSON route: the RPCs (gRPC-Gateway rendering of
          google.rpc.Status) and the hand-built GeoJSON, mesh-links and ingest
          routes alike. Served with the HTTP status mapped from `code`
          (3 INVALID_ARGUMENT -> 400, 5 NOT_FOUND -> 404, 13 INTERNAL -> 500,
          14 UNAVAILABLE -> 503, ...). All four members are always present.
        properties:
          code:
            description: Numeric gRPC status code (5 = NOT_FOUND).
          codeName:
            type: string
            description: |
              Canonical gRPC code name for `code`, e.g. `NOT_FOUND`,
              `INVALID_ARGUMENT`, `INTERNAL`. Branch on this rather than the
              message.
            enum: [OK, CANCELLED, UNKNOWN, INVALID_ARGUMENT, DEADLINE_EXCEEDED,
              NOT_FOUND, ALREADY_EXISTS, PERMISSION_DENIED, RESOURCE_EXHAUSTED,
              FAILED_PRECONDITION, ABORTED, OUT_OF_RANGE, UNIMPLEMENTED, INTERNAL,
              UNAVAILABLE, DATA_LOSS, UNAUTHENTICATED]
          message:
            description: Human-readable explanation. Not stable; do not parse.
          details:
            description: Structured error details. Usually empty.

  paths:
    /api/v1/events:
      get:
        responses:
          "304": {$ref: "#/components/responses/NotModified"}
          "400": {$ref: "#/components/responses/InvalidArgument"}
          "404": {$ref: "#/components/responses/NotFound"}
    /api/v1/events/{id}:
      get:
        responses:
          "304": {$ref: "#/components/responses/NotModified"}
          "404": {$ref: "#/components/responses/NotFound"}
    /api/v1/events/{id}/history:
      get:
        responses:
          "304": {$ref: "#/components/responses/NotModified"}
          "404": {$ref: "#/components/responses/NotFound"}
    /api/v1/history:
      get:
        responses:
          "304": {$ref: "#/components/responses/NotModified"}
          "400": {$ref: "#/components/responses/InvalidArgument"}
          "404": {$ref: "#/components/responses/NotFound"}
    /api/v1/places:
      get:
        responses:
          "304": {$ref: "#/components/responses/NotModified"}
    /api/v1/places/{place}:
      get:
        responses:
          "304": {$ref: "#/components/responses/NotModified"}
          "404": {$ref: "#/components/responses/NotFound"}
    /api/v1/places/{place}/summary:
      get:
        responses:
          "404": {$ref: "#/components/responses/NotFound"}
    /api/v1/cameras:
      get:
        responses:
          "304": {$ref: "#/components/responses/NotModified"}
          "404": {$ref: "#/components/responses/NotFound"}

spec:
  tags:
    - name: Map layers
      description: |
        RFC 7946 GeoJSON, one FeatureCollection per place and layer, ready to hand
        to MapLibre GL, Leaflet or OpenLayers. Hand-built (proto models geometry
        poorly), so these routes are described here rather than generated.
    - name: Ingest
      description: |
        The one authenticated WRITE endpoint, for operator-run monitors that push
        data no upstream feed publishes. Not for UI clients.
    - name: MCP
      description: Model Context Protocol endpoint for LLM agents.
    - name: Meta
      description: This document.

  components:
    securitySchemes:
      ingestBearer:
        type: http
        scheme: bearer
        description: |
          A per-reporter token issued by the operators (256-bit random, shown once).
          Only its SHA-256 lives server-side. Identity comes from the token alone:
          any reporter id in the body is ignored.

    headers:
      ETag:
        description: |
          Validator for conditional GET, weak (`W/"…"`) or strong. Send it back
          verbatim as `If-None-Match` to get a `304 Not Modified` when nothing
          changed.
        schema: {type: string, example: "W/\"8b42f929e5b2b8d55ebb87120b4a12c6\""}
      CacheControl:
        description: Freshness lifetime of this response.
        schema: {type: string, example: "public, max-age=60"}
      RetryAfter:
        description: Seconds to wait before retrying.
        schema: {type: integer, example: 1}

    parameters:
      Place:
        name: place
        in: path
        required: true
        description: |
          A place slug (`calaveras-county`, `ebbetts-pass`, `hwy4-murphys-arnold`)
          or namespaced id (`county:calaveras-county`). Slugs are globally unique.
          `GET /api/v1/places` lists them; `GET /api/v1/places:resolve` maps an
          address or lat/lng to the places containing it.
        schema: {type: string}
        examples:
          area: {value: ebbetts-pass, summary: The whole service area}
          county: {value: calaveras-county}
          namespacedId: {value: "county:tuolumne-county"}
          town: {value: arnold}
          corridor: {value: hwy4-murphys-arnold}
      IfNoneMatch:
        name: If-None-Match
        in: header
        required: false
        description: An `ETag` from an earlier response, for a `304` revalidation.
        schema: {type: string}
      MeshWindow:
        name: window
        in: query
        required: false
        description: |
          Recency window for relay links: a positive Go duration. The documented
          choices are `24h`, `72h` (the default), `168h` and `720h`; any positive
          duration works (`90m`), and values above `9600h` (400 days) are
          clamped. Anything else (`abc`, `0`, `-1h`) is a `400
          INVALID_ARGUMENT`. `/api/v1/mesh/links` echoes the applied window in
          `window`.
        schema: {type: string, default: 72h, example: 168h}
        examples:
          day: {value: 24h}
          default: {value: 72h}
          week: {value: 168h}
          month: {value: 720h}

    responses:
      NotModified:
        description: |
          The `If-None-Match` validator still matches; reuse your cached body.
          No body.
        headers:
          ETag: {$ref: "#/components/headers/ETag"}
          Cache-Control: {$ref: "#/components/headers/CacheControl"}
      InvalidArgument:
        description: A malformed parameter (bad `pageToken`, unknown enum, bad timestamp).
        content:
          application/json:
            schema: {$ref: "#/components/schemas/rpcStatus"}
            examples:
              invalidPageToken:
                summary: GET /api/v1/events?page_token=garbage
                value: {"code": 3, "codeName": "INVALID_ARGUMENT", "message": "invalid page_token", "details": []}
      NotFound:
        description: The named place, event or other resource does not exist.
        content:
          application/json:
            schema: {$ref: "#/components/schemas/rpcStatus"}
            examples:
              unknownPlace:
                summary: GET /api/v1/places/nope
                value: {"code": 5, "codeName": "NOT_FOUND", "message": "unknown place: \"nope\"", "details": []}
      HandoffUnavailable:
        description: |
          The server is handing over to a new instance during a deploy. Retry after
          `Retry-After` seconds. Plain text, not JSON.
        headers:
          Retry-After: {$ref: "#/components/headers/RetryAfter"}
        content:
          text/plain:
            schema: {type: string}
            example: "service is handing over to a new instance; retry\n"
      InvalidWindow:
        description: "`window` is not a positive Go duration (`abc`, `0`, `-1h`)."
        content:
          application/json:
            schema: {$ref: "#/components/schemas/rpcStatus"}
            examples:
              badWindow:
                summary: GET /api/v1/mesh/links?window=abc (message text illustrative)
                value: {"code": 3, "codeName": "INVALID_ARGUMENT", "message": "invalid window \"abc\": want a positive duration such as 72h", "details": []}
      Internal:
        description: Server-side failure. The real error is logged, never sent.
        content:
          application/json:
            schema: {$ref: "#/components/schemas/rpcStatus"}
            example: {"code": 13, "codeName": "INTERNAL", "message": "internal error", "details": []}

    schemas:
      # ---------------------------------------------------------------- GeoJSON

      MapFeatureCollection:
        type: object
        description: |
          An RFC 7946 FeatureCollection for one place and one layer. `metadata` is
          an RFC 7946 §6.1 foreign member that map libraries ignore; read it for
          source health and attribution before drawing.
        required: [type, features, metadata]
        properties:
          type: {type: string, enum: [FeatureCollection]}
          features:
            type: array
            description: Possibly empty. Empty with `sourceStatus` OK means confirmed-empty; empty with UNAVAILABLE means unknown.
            items: {$ref: "#/components/schemas/MapFeature"}
          metadata: {$ref: "#/components/schemas/MapLayerMetadata"}

      MapLayerMetadata:
        type: object
        description: Provenance and freshness of the whole layer.
        required: [layer, area, generatedAt, sourceStatus, schemaVersion]
        properties:
          layer:
            type: string
            description: The lowercase layer slug from the URL (not the UPPERCASE `properties.layer`).
            enum: [road_incident, chain_control, road_segment, message_sign, weather_alert,
              fire_weather, earthquake, wildfire, evacuation, power, mesh_node, mesh_link, camera]
          area: {type: string, description: "Slug of the requested place (even when it was requested by id)."}
          generatedAt: {type: string, format: date-time, description: "When this body was rendered. Not part of the ETag."}
          sourceStatus:
            type: string
            enum: [OK, STALE, UNAVAILABLE]
            description: |
              Health of the feeds behind this layer, the fail-loud contract:
              `OK` - current and complete. `STALE` - upstream is failing (or one
              of two feeds is); these features are the last good data, as of
              `lastSourceUpdate`. Show them with a caveat. `UNAVAILABLE` - nothing
              trustworthy to show; `features` is always empty and the layer's
              state is UNKNOWN. Never render it as "no hazards".
          lastSourceUpdate:
            type: string
            format: date-time
            description: Last successful upstream fetch. Present only when `sourceStatus` is not OK and a success is on record.
          attribution: {type: string, description: "Credit line to render with the layer whenever it is drawn. Parts are joined with \" · \"."}
          sourceUrl:
            type: string
            format: uri
            description: The authoritative viewer for the layer, where one exists. Always set on `evacuation` (Genasys Protect), in every state.
          schemaVersion: {type: integer, enum: [1], description: "Envelope schema version; bumps only on a breaking envelope change."}

      MapFeature:
        type: object
        description: An RFC 7946 Feature.
        required: [type, geometry, properties]
        properties:
          type: {type: string, enum: [Feature]}
          geometry: {$ref: "#/components/schemas/MapGeometry"}
          properties: {$ref: "#/components/schemas/MapFeatureProperties"}

      MapGeometry:
        type: object
        nullable: true
        description: |
          An RFC 7946 geometry, or `null` for a feature with no location (NWS zone
          alerts and the fire-weather region banner): render those as a banner
          or list row, not a shape.

          A position is `[longitude, latitude]`, longitude FIRST (RFC 7946
          §3.1.1), the reverse of the `{lat, lng}` objects on the JSON RPCs.
          Store-derived positions are trimmed to 5 decimals (~1 m).

          Which types appear: Point (most layers: incidents, signs, cameras,
          chain controls, quakes, mesh nodes, forecast points, unmapped fires);
          LineString (road_segment routes, mesh_link edges); Polygon or
          MultiPolygon (power outage areas, evacuation zones, fire perimeters).
          Geometry passed through from an upstream ArcGIS feed may be any RFC 7946
          type except GeometryCollection.
        required: [type, coordinates]
        properties:
          type:
            type: string
            enum: [Point, MultiPoint, LineString, MultiLineString, Polygon, MultiPolygon]
          coordinates:
            type: array
            description: |
              Nesting depends on `type`:
              Point `[lng, lat]`;
              MultiPoint and LineString `[[lng, lat], ...]` (a LineString has 2+);
              MultiLineString and Polygon `[[[lng, lat], ...], ...]` (a Polygon's
              first ring is the exterior; every ring closes on its first position);
              MultiPolygon `[[[[lng, lat], ...], ...], ...]`.
            items: {}
            example: [-120.38806, 37.98152]

      MapFeatureProperties:
        type: object
        description: |
          The envelope shared by every feature of every layer, plus exactly one
          per-kind block named after the layer (`incident`, `road`,
          `chainControl`, `messageSign`, `weather`, `fireWeather`, `earthquake`,
          `wildfire`, `evacuation`, `power`, `mesh`, `meshLink`, `camera`).
          Optional members are omitted, never `""` or `0`, when they have no value.
        required: [id, layer, kind, severity, severityRank, headline, source]
        properties:
          id:
            type: string
            description: |
              Stable feature id. On event-backed layers it IS the event id, so
              `GET /api/v1/events/{id}` returns the full record and its history
              (`wildfire`, `evacuation`, `weather_alert`, `earthquake`,
              `road_incident`, `power`, `mesh_node`). Condition layers use their
              own ids (`road:…`, `cc:…`, `cms:…`, `fw:…`, `mesh_link:…`, `d10-…`).
          layer:
            type: string
            description: |
              UPPERCASE layer of THIS feature. Usually the URL layer upper-cased,
              except that the `mesh_link` layer mixes `MESH_LINK` edges and
              `MESH_NODE` points. Only some values equal an Event `layer` enum
              (`v1Layer`): WILDFIRE, EVACUATION, WEATHER_ALERT, EARTHQUAKE,
              ROAD_INCIDENT and POWER do. MESH_NODE is the Event layer `MESH`.
              ROAD_SEGMENT, CHAIN_CONTROL, MESSAGE_SIGN, MESH_LINK and CAMERA are
              map-only. FIRE_WEATHER exists in the enum but these features are
              conditions, not events.
            enum: [ROAD_INCIDENT, CHAIN_CONTROL, ROAD_SEGMENT, MESSAGE_SIGN, WEATHER_ALERT,
              FIRE_WEATHER, EARTHQUAKE, WILDFIRE, EVACUATION, POWER, MESH_NODE, MESH_LINK, CAMERA]
          kind:
            type: string
            description: Human label for the feature type.
            example: Road incident
            enum: [Road incident, Chain control, Road segment, Message sign, Weather alert,
              Fire weather, Fire-weather forecast, Earthquake, Wildfire, Evacuation,
              Power outage, Public Safety Power Shutoff, Mesh node, Relay link, Traffic camera]
          category:
            type: string
            description: |
              Sub-type within the layer. Values by layer:
              road_incident `incident` (CHP) | `closure` (Caltrans planned lane closure);
              chain_control `r1` | `r2` | `r3` | `closed`;
              message_sign `message` | `blank` | `unknown`;
              weather_alert the NWS event name (`Heat Advisory`, `Red Flag Warning`);
              fire_weather banner `normal` | `elevated` | `red-flag` (absent on forecast points);
              wildfire `wildfire`; evacuation the lowercase level (`order`, `warning`, …);
              power `unplanned` | `planned` | `psps`;
              mesh_node the node type `repeater` | `companion` | `room_server` | `sensor`.
              Absent on road_segment, camera and mesh_link edges.
          severity:
            type: string
            enum: [INFO, MINOR, MODERATE, SEVERE, EXTREME]
            description: |
              Unified severity. `message_sign`, `camera`, `mesh_node`, `mesh_link`
              and fire-weather forecast points are always `INFO` (context, not
              hazards). Most power outages are INFO too: the median outage affects
              one customer.
          severityRank:
            type: integer
            minimum: 0
            maximum: 4
            description: "Numeric severity for sorting and styling: INFO 0, MINOR 1, MODERATE 2, SEVERE 3, EXTREME 4."
          headline: {type: string, description: "One-line label for a popup or list row."}
          description:
            type: string
            description: |
              Longer text. road_incident: the readable narrative (AI-enhanced for
              CHP, composed from Caltrans fields for closures). evacuation: Cal OES
              public info, verbatim, never paraphrase. weather_alert: the NWS text,
              verbatim. road_segment: why a road is not OPEN.
          summary:
            type: string
            description: AI-written plain-language summary (same as Event.summary). Absent when the event has none; fall back to `description`.
          summaryEnhanced:
            type: object
            description: Present with `summary` when a model wrote it, so a UI can label it as machine-written.
            properties:
              enhancedAt: {type: string, format: date-time}
          status:
            type: string
            description: |
              Meaning depends on the layer, and it is NOT always the Event
              `EventStatus`:
              - wildfire, weather_alert, earthquake, road_incident, power,
                mesh_node: the lifecycle `ACTIVE` or `SCHEDULED` (an advance watch,
                a planned closure window not yet set up, a planned shutoff). Map
                layers never carry RESOLVED or EXPIRED features; those are in
                `/api/v1/history`.
              - evacuation: the evacuation LEVEL `ORDER` | `WARNING` | `ADVISORY` |
                `SHELTER_IN_PLACE`.
              - road_segment: the road status `OPEN` | `CLOSED` | `RESTRICTED` |
                `MAINTENANCE` (absent until the road has been measured).
              - absent on chain_control, message_sign, fire_weather, camera and
                mesh_link edges.
            enum: [ACTIVE, SCHEDULED, ORDER, WARNING, ADVISORY, SHELTER_IN_PLACE,
              OPEN, CLOSED, RESTRICTED, MAINTENANCE, UNSPECIFIED]
          effective: {type: string, format: date-time, description: "When it began or takes effect (a SCHEDULED feature's start)."}
          expires: {type: string, format: date-time, description: "Upstream expiry (weather alerts, fire-weather products). Not set from PG&E restoration estimates."}
          updatedAt: {type: string, format: date-time, description: "Last content revision. For mesh nodes this is NOT liveness; use mesh.lastHeardAt / lastRelayedAt."}
          areaLabel: {type: string, description: "Where, in words (\"SR 4 at Country Club Drive\", \"Murphys, CA\")."}
          source: {$ref: "#/components/schemas/MapFeatureSource"}
          incident: {$ref: "#/components/schemas/MapIncidentProps"}
          road: {$ref: "#/components/schemas/MapRoadProps"}
          chainControl: {$ref: "#/components/schemas/MapChainControlProps"}
          messageSign: {$ref: "#/components/schemas/MapMessageSignProps"}
          weather: {$ref: "#/components/schemas/MapWeatherProps"}
          fireWeather: {$ref: "#/components/schemas/MapFireWeatherProps"}
          earthquake: {$ref: "#/components/schemas/MapEarthquakeProps"}
          wildfire: {$ref: "#/components/schemas/MapWildfireProps"}
          evacuation: {$ref: "#/components/schemas/MapEvacuationProps"}
          power: {$ref: "#/components/schemas/MapPowerProps"}
          mesh: {$ref: "#/components/schemas/MapMeshProps"}
          meshLink: {$ref: "#/components/schemas/MapMeshLinkProps"}
          camera: {$ref: "#/components/schemas/MapCameraProps"}

      MapFeatureSource:
        type: object
        description: The upstream feed this feature came from. Render `attribution` with the feature.
        required: [id, name]
        properties:
          id: {type: string, description: "Source registry id (see GET /api/v1/sources): chp, caltrans, google, nws, usgs, calfire, firis, caloes, pge, psps, meshcore.", example: caltrans}
          name: {type: string, example: CHP / Caltrans}
          url: {type: string, format: uri, description: "Deep link to the upstream record or viewer, when there is one."}
          attribution: {type: string, example: quickmap.dot.ca.gov}
          fetchedAt: {type: string, format: date-time}

      MapIncidentProps:
        type: object
        description: road_incident block.
        properties:
          logNumber: {type: string, description: "CHP log number, or the Caltrans closure id."}
          closure: {$ref: "#/components/schemas/MapClosureProps"}
      MapClosureProps:
        type: object
        description: |
          Set on Caltrans planned lane closures (category `closure`) only. One
          feature per work window. `plannedEnd` is an estimate crews overrun: an
          ACTIVE closure past it is still on the road until Caltrans records it
          picked up.
        required: [windowId]
        properties:
          windowId: {type: string}
          closureType: {type: string, example: Lane}
          workType: {type: string, example: Drainage Work}
          lanesClosed: {type: string, description: "Caltrans's lane list, verbatim., example: \"1, 2, LShoulder, RShoulder\""}
          totalLanes: {type: integer}
          estimatedDelayMinutes: {type: integer}
          plannedStart: {type: string, format: date-time}
          plannedEnd: {type: string, format: date-time}
          setUpAt: {type: string, format: date-time, description: "When the crew reported the closure set up. Absent while SCHEDULED."}
      MapRoadProps:
        type: object
        description: road_segment block (Google Routes travel time over a configured route). The numbers are absent, not 0, until the route has been measured.
        required: [roadId]
        properties:
          roadId: {type: string}
          congestion: {type: string, enum: [CLEAR, LIGHT, MODERATE, HEAVY, SEVERE, UNSPECIFIED]}
          delayMinutes: {type: integer, description: "Minutes over free-flow. 0 is a real reading."}
          durationMinutes: {type: integer}
          distanceKm: {type: integer}
      MapChainControlProps:
        type: object
        description: chain_control block. Severity follows the level (R1 MINOR, R2 MODERATE, R3 SEVERE); a seasonal pass closure (`category` closed) is MINOR.
        properties:
          level: {type: string, enum: [R1, R2, R3], description: "Absent on a closure."}
          highway: {type: string}
          direction: {type: string, example: Eastbound}
      MapMessageSignProps:
        type: object
        description: message_sign block - what a Caltrans changeable message sign is showing, verbatim. Context, not a hazard.
        required: [signId, district, inService]
        properties:
          signId: {type: string, example: V42}
          district: {type: integer, example: 10}
          route: {type: string, example: SR-108}
          direction: {type: string, example: East}
          inService: {type: boolean}
          pages:
            type: array
            description: One or two pages of exactly three lines; a blank line is "". Absent when the sign is blank or unreadable.
            items:
              type: array
              minItems: 3
              maxItems: 3
              items: {type: string}
      MapWeatherProps:
        type: object
        description: weather_alert block. The NWS CAP fields are verbatim; `nwsSeverity` is NWS's own scale, distinct from the unified `severity`.
        properties:
          event: {type: string, example: Heat Advisory}
          source: {type: string, enum: [NWS]}
          zones: {type: array, items: {type: string}, example: [CAZ137]}
          nwsSeverity: {type: string, enum: [Extreme, Severe, Moderate, Minor, Unknown]}
          certainty: {type: string, example: Likely}
          urgency: {type: string, example: Expected}
          instruction: {type: string, description: "NWS instruction text. Never paraphrase."}
      MapFireWeatherProps:
        type: object
        description: |
          fire_weather block. The region banner (id `fw:region`, null geometry)
          carries the ISSUED `state`; only NWS products set it (Fire Weather Watch
          -> elevated, Red Flag Warning -> red-flag). Forecast points (id
          `fw:forecast:<location>`) carry `forecast` instead, are always INFO and
          never imply a warning.
        properties:
          state: {type: string, enum: [normal, elevated, red-flag]}
          sourceEvent: {type: string, description: "The NWS product behind the state, e.g. Red Flag Warning."}
          zones: {type: array, items: {type: string}}
          forecast:
            type: object
            properties:
              source: {type: string, example: "NWS (STO 73,42)"}
              issuedAt: {type: string, format: date-time}
              horizonHours: {type: integer}
              peakWindGustKmh: {type: integer}
              peakWindGustAt: {type: string, format: date-time}
              minHumidityPercent: {type: integer}
      MapEarthquakeProps:
        type: object
        description: earthquake block (USGS).
        required: [magnitude, depthKm]
        properties:
          magnitude: {type: number}
          depthKm: {type: number}
          felt: {type: integer, description: "USGS \"Did You Feel It?\" reports."}
      MapWildfireProps:
        type: object
        description: wildfire block (CAL FIRE incidents and FIRIS perimeters).
        required: [containment, hasPerimeter]
        properties:
          acres: {type: number}
          containment: {type: integer, minimum: 0, maximum: 100, description: "Percent contained."}
          county: {type: string}
          cause: {type: string}
          hasPerimeter: {type: boolean, description: "True when the geometry is a mapped perimeter rather than a point."}
      MapEvacuationProps:
        type: object
        description: evacuation block (Cal OES / Genasys zones). Life-safety; reference only, link `source.url`.
        required: [level]
        properties:
          zoneId: {type: string}
          level: {type: string, enum: [ORDER, WARNING, ADVISORY, SHELTER_IN_PLACE]}
          eventType: {type: string}
          county: {type: string}
      MapPowerProps:
        type: object
        description: |
          power block, both PG&E feeds. `category` unplanned|planned sets the
          outage fields; `psps` (Public Safety Power Shutoff) sets the PSPS fields.
          `estimatedRestoration`, `deEnergizationEnd` and `allClear` are PG&E
          ESTIMATES that are routinely overrun; label them as estimates.
        properties:
          outageId: {type: string}
          cause: {type: string, description: "Raw PG&E cause code, often blank."}
          customersAffected: {type: integer}
          crewStatus: {type: string}
          estimatedRestoration: {type: string, format: date-time}
          eventName: {type: string}
          stage: {type: string, enum: [Watch, Warning]}
          medicalBaselineAffected: {type: integer, description: "Customers whose medical equipment depends on grid power."}
          deEnergizationStart: {type: string, format: date-time}
          deEnergizationEnd: {type: string, format: date-time}
          allClear: {type: string, format: date-time, description: "PG&E's PLANNED all-clear, not proof the shutoff ended."}
      MapMeshProps:
        type: object
        description: |
          mesh_node block (MeshCore node presence; also on the MESH_NODE points of
          the mesh_link layer). Signal readings are absent when no bridge heard the
          node; a present 0 is a reading. A node's freshness is the later of
          `lastHeardAt` and `lastRelayedAt`, never the feature's `updatedAt`.
        required: [publicKey]
        properties:
          publicKey: {type: string, description: "64-hex Ed25519 public key; joins to MeshLink a/b."}
          nodeType: {type: string, enum: [companion, repeater, room_server, sensor]}
          name: {type: string}
          snr: {type: number, description: "Last-heard SNR, dB."}
          rssi: {type: integer, description: "Last-heard RSSI, dBm."}
          hopCount: {type: integer, description: "Hops on the last heard path. 0 = heard direct."}
          gateways: {type: array, items: {type: string}, description: "Public keys of the observers that heard the node."}
          lastHeardAt: {type: string, format: date-time, description: "When the node's own signed advert last reached the Grid."}
          lastRelayedAt: {type: string, format: date-time, description: "When a packet this node relayed last reached the Grid."}
          inRegion: {type: boolean, description: "mesh_link layer only: true = inside the requested place, false = a neighbour outside it, included because it links in."}
          reachability: {type: string, enum: [REACHABLE, UNREACHABLE], description: "An operator monitor's verdict on the node's admin interface. Absent when no monitor watches it."}
          admin: {$ref: "#/components/schemas/MapMeshAdminProps"}
      MapMeshAdminProps:
        type: object
        description: The last sample an operator monitor read off the node itself. Gauges the device did not report are absent, never 0.
        required: [reporterId]
        properties:
          reporterId: {type: string, example: alanpi}
          reportedAt: {type: string, format: date-time}
          lastSuccessAt: {type: string, format: date-time}
          batteryVolts: {type: number}
          batteryPercent: {type: number}
          batteryPercentSource: {type: string, example: estimated}
          temperatureC: {type: number}
          noiseFloorDbm: {type: integer}
          txQueueLen: {type: integer}
          uptimeSeconds: {type: integer, format: int64}
          airtimeMs: {type: integer, format: int64}
          rxAirtimeMs: {type: integer, format: int64}
          packetsSent: {type: integer, format: int64}
          packetsReceived: {type: integer, format: int64}
          recvErrors: {type: integer, format: int64}
      MapMeshLinkProps:
        type: object
        description: mesh_link edge block - one undirected relay link between two located nodes. Weight by `daysActive`/`observations`, fade by `lastSeen`.
        required: [a, b, observations, daysActive]
        properties:
          a: {type: string, description: "Public key of one end (a < b)."}
          b: {type: string, description: "Public key of the other end."}
          observations: {type: integer, description: "Packets seen traversing the link in the window."}
          daysActive: {type: integer, description: "Distinct days the link was observed."}
          firstSeen: {type: string, format: date-time}
          lastSeen: {type: string, format: date-time}
          bestSnr: {type: number, description: "Peak SNR of an advert over the link. Absent when 0."}
      MapCameraProps:
        type: object
        description: camera block - a Caltrans CCTV camera, same data as GET /api/v1/cameras?place=. Load the image and stream directly from Caltrans; they are not proxied.
        required: [imageUrl, distanceMeters]
        properties:
          imageUrl: {type: string, format: uri, description: "Snapshot JPEG."}
          imageRefreshMinutes: {type: integer, description: "How often Caltrans refreshes the snapshot. Absent = not reported."}
          streamUrl: {type: string, format: uri, description: "HLS .m3u8 live stream. Absent = image only."}
          route: {type: string}
          direction: {type: string}
          county: {type: string}
          elevationFeet: {type: integer}
          distanceMeters: {type: integer, description: "Distance from the requested place; 0 = inside it."}

      # ------------------------------------------------------------- mesh links

      MeshLinkList:
        type: object
        required: [window, generatedAt, links]
        properties:
          window: {type: string, description: "The window applied, e.g. 72h., example: 72h"}
          generatedAt: {type: string, format: date-time}
          links:
            type: array
            items: {$ref: "#/components/schemas/MeshLink"}
      MeshLink:
        type: object
        description: One undirected relay link. Every member is always present.
        required: [a, b, observations, daysActive, firstSeen, lastSeen, bestSnr]
        properties:
          a: {type: string, description: "Public key (64 hex) of one end; a < b."}
          b: {type: string, description: "Public key of the other end."}
          observations: {type: integer, description: "Packets seen traversing the link in the window."}
          daysActive: {type: integer, description: "Distinct days observed; a reliability weight."}
          firstSeen: {type: string, format: date-time}
          lastSeen: {type: string, format: date-time, description: "Drive recency fade from this."}
          bestSnr: {type: number, description: "Peak SNR (dB) of an advert seen traversing it; 0 when none was measured."}

      # ----------------------------------------------------------------- ingest

      IngestAccepted:
        type: object
        description: The 202 body. Validated and queued, not yet stored; it lands on the next ingest cycle (about a minute).
        required: [reporterId, stream, accepted, receivedAt]
        properties:
          reporterId: {type: string, description: "The reporter the token belongs to."}
          stream: {type: string}
          accepted:
            type: integer
            description: "mesh.repeater: nodes accepted. mesh.packet: ADVERTs applied (not packets received). burn.line: readings staged."
          warnings:
            type: array
            description: Entries skipped without failing the report (bad id, duplicate, unknown line, bad signature). Fix your output if present. mesh.packet lists at most 25, then a count.
            items: {type: string}
          receivedAt: {type: string, format: date-time}
      MeshRepeaterReport:
        type: object
        description: |
          `mesh.repeater` (schema_version 1): an operator monitor's COMPLETE
          current set of MeshCore repeaters it logged into. A report replaces the
          reporter's previous set; a node left out is no longer monitored. Request
          bodies are snake_case. Unknown fields are ignored. Unread values are
          `null`, never `0`.
        required: [schema_version, repeaters]
        properties:
          schema_version: {type: integer, enum: [1]}
          generated_at: {type: string, format: date-time, description: "When the report was built. Clamped to the server's clock."}
          repeaters:
            type: array
            maxItems: 1000
            items: {$ref: "#/components/schemas/MeshRepeaterReading"}
      MeshRepeaterReading:
        type: object
        required: [id]
        properties:
          id: {type: string, pattern: "^[0-9a-fA-F]{8,64}$", description: "Node public key or a prefix of it (8-64 hex). A bad id is a warning; the rest of the report still lands."}
          name: {type: string}
          last_attempt: {type: integer, format: int64, nullable: true, description: "Unix seconds of the monitor's last attempt on this node."}
          last_success: {type: integer, format: int64, nullable: true, description: "Unix seconds of the last successful read; null if never. Reachability is derived from its age."}
          battery_voltage: {type: number, nullable: true}
          battery_percent: {type: number, nullable: true}
          battery_percent_source: {type: string, example: estimated}
          temperature_c: {type: number, nullable: true}
          humidity: {type: number, nullable: true}
          pressure: {type: number, nullable: true}
          uptime_s: {type: integer, format: int64, nullable: true}
          airtime_ms: {type: integer, format: int64, nullable: true}
          rx_airtime_ms: {type: integer, format: int64, nullable: true}
          noise_floor_dbm: {type: integer, nullable: true}
          last_rssi_dbm: {type: integer, nullable: true}
          last_snr_db: {type: number, nullable: true}
          tx_queue_len: {type: integer, nullable: true}
          nb_sent: {type: integer, format: int64, nullable: true}
          nb_recv: {type: integer, format: int64, nullable: true}
          sent_flood: {type: integer, format: int64, nullable: true}
          sent_direct: {type: integer, format: int64, nullable: true}
          recv_flood: {type: integer, format: int64, nullable: true}
          recv_direct: {type: integer, format: int64, nullable: true}
          direct_dups: {type: integer, format: int64, nullable: true}
          flood_dups: {type: integer, format: int64, nullable: true}
          full_evts: {type: integer, format: int64, nullable: true}
          recv_errors: {type: integer, format: int64, nullable: true}
          online: {type: boolean, nullable: true, description: "Accepted and logged, but not used; reachability comes from last_success."}
      MeshPacketReport:
        type: object
        description: |
          `mesh.packet` (schema_version 1): raw MeshCore frames a companion radio
          heard, in the per-packet envelope the MQTT bridges publish. ADVERTs
          (packet_type 4) update a node after its Ed25519 signature verifies;
          other flood-routed packets credit relays. Answers 400 when MeshCore
          ingest is off on the server.
        required: [schema_version, packets]
        properties:
          schema_version: {type: integer, enum: [1]}
          generated_at: {type: string, format: date-time}
          observer: {type: string, pattern: "^[0-9a-fA-F]{8,64}$", description: "Public key (or 4+ byte prefix) of the receiving radio. Defaults to the reporter id."}
          packets:
            type: array
            maxItems: 1000
            items: {$ref: "#/components/schemas/MeshPacket"}
      MeshPacket:
        type: object
        description: One reception. Extra bridge fields are accepted and ignored.
        required: [packet_type, raw]
        properties:
          packet_type: {type: integer, description: "MeshCore payload type; only 4 (ADVERT) updates a node."}
          raw: {type: string, description: "The full over-the-air frame as hex (header, path, payload), or a meshcore://<hex> link."}
          SNR: {description: "Reception SNR in dB (number or numeric string)."}
          RSSI: {description: "Reception RSSI in dBm (number or numeric string)."}
          origin_id: {type: string, description: "Receiving radio's public key, if different from `observer`."}
          timestamp: {type: string, description: "Ignored; the server stamps its own receive time."}
      BurnLineReport:
        type: object
        description: |
          `burn.line` (schema_version 1): readings of the county burn-day phone
          recordings, sent as ONE batched report per run (the per-reporter rate
          limit would 429 a second push). Each reading is staged durably.
        required: [schema_version, readings]
        properties:
          schema_version: {type: integer, enum: [1]}
          generated_at: {type: string, format: date-time}
          readings:
            type: array
            minItems: 1
            maxItems: 1000
            items: {$ref: "#/components/schemas/BurnLineReading"}
      BurnLineReading:
        type: object
        required: [line_id, status, observed_at]
        properties:
          line_id: {type: string, description: "A configured line id (grid.burn.lines); unknown ids are warnings."}
          status: {type: string, enum: [green, red, orange], description: "green = permissive burn day."}
          message: {type: string}
          cleaned_transcription: {type: string}
          confidence: {type: integer, minimum: 0, maximum: 100}
          observed_at: {type: string, format: date-time, description: "When the line was called. Required; future stamps are clamped."}

      # -------------------------------------------------------------------- MCP

      JsonRpcRequest:
        type: object
        description: A JSON-RPC 2.0 request. Omit `id` for a notification (answered 202, no body).
        required: [jsonrpc, method]
        properties:
          jsonrpc: {type: string, enum: ["2.0"]}
          id: {description: "Request id (string or number), echoed in the response."}
          method:
            type: string
            enum: [initialize, ping, tools/list, tools/call, resources/list, resources/read,
              prompts/list, prompts/get, notifications/initialized]
          params: {type: object, additionalProperties: true}
      JsonRpcResponse:
        type: object
        required: [jsonrpc]
        properties:
          jsonrpc: {type: string, enum: ["2.0"]}
          id: {description: "The request's id; null when the request could not be parsed."}
          result: {type: object, additionalProperties: true, description: "Present on success."}
          error:
            type: object
            description: "Present on failure. -32700 parse error, -32601 method not found, -32602 invalid params, -32603 internal error."
            required: [code, message]
            properties:
              code: {type: integer}
              message: {type: string}

  paths:
    /api/v1/places/{place}/map/{layer}.geojson:
      get:
        tags: [Map layers]
        operationId: GetMapLayer
        summary: One map layer for a place, as GeoJSON
        description: |
          An RFC 7946 FeatureCollection of one layer's features within a place.
          Coordinates are `[longitude, latitude]`. Check `metadata.sourceStatus`
          before drawing: UNAVAILABLE means unknown (empty `features`), STALE
          means last-good data.

          | layer | features | backed by |
          |---|---|---|
          | `road_incident` | Points: CHP incidents (category `incident`) and Caltrans planned lane closures (`closure`, SCHEDULED until set up) | events |
          | `chain_control` | Points: active R1/R2/R3 checkpoints and seasonal pass closures | live Caltrans |
          | `road_segment` | LineStrings: configured routes with travel time; `status` OPEN/CLOSED/RESTRICTED/MAINTENANCE | live Google Routes + Caltrans |
          | `message_sign` | Points: Caltrans message signs and their text; always INFO | live Caltrans |
          | `weather_alert` | null geometry: NWS zone watches/warnings/advisories | events |
          | `fire_weather` | one null-geometry region banner (`fw:region`) plus forecast Points | live NWS |
          | `earthquake` | Points | events (USGS) |
          | `wildfire` | Points or (Multi)Polygon perimeters | events (CAL FIRE, FIRIS) |
          | `evacuation` | (Multi)Polygon zones; `status` is the level | events (Cal OES) |
          | `power` | Polygons/Points: PG&E outages (`unplanned`/`planned`) and PSPS (`psps`) | events |
          | `mesh_node` | Points: MeshCore nodes in the place; always INFO | events |
          | `mesh_link` | LineString relay links touching the place plus the MESH_NODE Points at both ends (neighbours outside the place have `mesh.inRegion: false`); honours `window` | derived |
          | `camera` | Points: Caltrans CCTV cameras near the place, nearest first; always INFO | live Caltrans |

          Event-backed layers carry only ACTIVE and SCHEDULED features, and each
          feature `id` is an event id usable with `/api/v1/events/{id}`. The
          `.geojson` suffix is optional (`/map/wildfire` is the same resource).

          **Caching.** `Cache-Control: public, max-age=60` and a weak `ETag`
          (`W/"…"`) over the layer's content, excluding `metadata.generatedAt`.
          Revalidate with `If-None-Match`: the answer is `304` until the
          features, `sourceStatus`, `lastSourceUpdate` or `attribution` change,
          so polling a quiet layer costs no body.
        parameters:
          - {$ref: "#/components/parameters/Place"}
          - name: layer
            in: path
            required: true
            description: Layer slug (lowercase).
            schema:
              type: string
              enum: [road_incident, chain_control, road_segment, message_sign, weather_alert,
                fire_weather, earthquake, wildfire, evacuation, power, mesh_node, mesh_link, camera]
          - {$ref: "#/components/parameters/MeshWindow"}
          - {$ref: "#/components/parameters/IfNoneMatch"}
        responses:
          "200":
            description: The layer. Empty `features` is a valid answer; read `metadata.sourceStatus` to know whether it is confirmed-empty or unknown.
            headers:
              ETag: {$ref: "#/components/headers/ETag"}
              Cache-Control: {$ref: "#/components/headers/CacheControl"}
            content:
              application/geo+json:
                schema: {$ref: "#/components/schemas/MapFeatureCollection"}
                examples:
                  road_incident:
                    summary: road_incident - a CHP incident and a Caltrans closure
                    value: {"type": "FeatureCollection", "features": [
                      {"type": "Feature", "geometry": {"type": "Point", "coordinates": [-120.36108, 38.24239]}, "properties": {"id": "chp:261106ST0341", "layer": "ROAD_INCIDENT", "kind": "Road incident", "category": "incident", "severity": "MINOR", "severityRank": 1, "headline": "Traffic hazard causing near-miss incidents; CHP responding", "description": "Reported traffic hazard on SR 4 at Country Club Drive. CHP responded; the hazard was causing vehicles to have near-miss incidents. No lanes reported blocked and no injuries indicated in the report.", "summary": "Reported traffic hazard on SR 4 at Country Club Drive. CHP responded; the hazard was causing vehicles to have near-miss incidents. No lanes reported blocked and no injuries indicated in the report.", "summaryEnhanced": {"enhancedAt": "2026-11-07T03:13:58Z"}, "status": "ACTIVE", "effective": "2026-11-07T02:34:00Z", "updatedAt": "2026-11-07T03:13:00Z", "areaLabel": "SR 4 at Country Club Drive", "source": {"id": "chp", "name": "CHP / Caltrans", "attribution": "quickmap.dot.ca.gov"}, "incident": {"logNumber": "261106ST0341"}}},
                      {"type": "Feature", "geometry": {"type": "Point", "coordinates": [-120.38806, 37.98152]}, "properties": {"id": "caltrans:d10-C49SA-0001-2026-11-06-170100", "layer": "ROAD_INCIDENT", "kind": "Road incident", "category": "closure", "severity": "MODERATE", "severityRank": 2, "headline": "Hwy 49 lane closure (Drainage Work)", "description": "Closed: lane 1, lane 2, left shoulder, right shoulder (of 4 lanes).", "status": "ACTIVE", "effective": "2026-11-06T22:02:00Z", "updatedAt": "2026-11-06T22:03:03Z", "areaLabel": "Hwy 49 from Solinski Street (Left) to Washington Street, near Sonora", "source": {"id": "caltrans", "name": "Caltrans", "attribution": "cwwp2.dot.ca.gov"}, "incident": {"logNumber": "C49SA", "closure": {"windowId": "C49SA-0001-2026-11-06-17:01:00", "closureType": "Lane", "workType": "Drainage Work", "lanesClosed": "1, 2, LShoulder, RShoulder", "totalLanes": 4, "plannedStart": "2026-11-07T01:01:00Z", "plannedEnd": "2026-12-07T08:01:00Z", "setUpAt": "2026-11-06T22:02:00Z"}}}}],
                      "metadata": {"layer": "road_incident", "area": "ebbetts-pass", "generatedAt": "2026-11-07T04:03:21Z", "sourceStatus": "OK", "attribution": "quickmap.dot.ca.gov · cwwp2.dot.ca.gov", "schemaVersion": 1}}
                  chain_control:
                    summary: chain_control - a seasonal pass closure
                    value: {"type": "FeatureCollection", "features": [
                      {"type": "Feature", "geometry": {"type": "Point", "coordinates": [-119.99421, 38.48135]}, "properties": {"id": "cc:38.48135,-119.99421", "layer": "CHAIN_CONTROL", "kind": "Chain control", "category": "closed", "severity": "MINOR", "severityRank": 1, "headline": "road closed", "source": {"id": "caltrans", "name": "Caltrans", "attribution": "quickmap.dot.ca.gov"}, "chainControl": {"direction": "Eastbound"}}}],
                      "metadata": {"layer": "chain_control", "area": "ebbetts-pass", "generatedAt": "2026-11-07T04:03:22Z", "sourceStatus": "OK", "attribution": "cwwp2.dot.ca.gov · quickmap.dot.ca.gov", "schemaVersion": 1}}
                  road_segment:
                    summary: road_segment - an OPEN route (coordinates trimmed)
                    value: {"type": "FeatureCollection", "features": [
                      {"type": "Feature", "geometry": {"type": "LineString", "coordinates": [[-120.54006, 38.0675], [-120.54015, 38.06759], [-120.54017, 38.06779]]}, "properties": {"id": "road:hwy4-angels-murphys", "layer": "ROAD_SEGMENT", "kind": "Road segment", "severity": "INFO", "severityRank": 0, "headline": "Hwy 4 — Angels Camp to Murphys", "status": "OPEN", "areaLabel": "Angels Camp to Murphys", "source": {"id": "google", "name": "Google Routes + Caltrans", "attribution": "Google · quickmap.dot.ca.gov"}, "road": {"roadId": "hwy4-angels-murphys", "congestion": "CLEAR", "delayMinutes": 0, "durationMinutes": 11, "distanceKm": 13}}}],
                      "metadata": {"layer": "road_segment", "area": "ebbetts-pass", "generatedAt": "2026-11-07T04:03:23Z", "sourceStatus": "OK", "attribution": "cwwp2.dot.ca.gov · quickmap.dot.ca.gov", "schemaVersion": 1}}
                  message_sign:
                    summary: message_sign - a two-page sign and a blank one
                    value: {"type": "FeatureCollection", "features": [
                      {"type": "Feature", "geometry": {"type": "Point", "coordinates": [-120.27482, 37.99242]}, "properties": {"id": "cms:10:V42", "layer": "MESSAGE_SIGN", "kind": "Message sign", "category": "message", "severity": "INFO", "severityRank": 0, "headline": "SONORA PASS OPEN / TIOGA PASS OPEN", "effective": "2026-11-05T20:21:06Z", "areaLabel": "EB 108 SOULSBYVILLE", "source": {"id": "caltrans", "name": "Caltrans", "attribution": "cwwp2.dot.ca.gov"}, "messageSign": {"signId": "V42", "district": 10, "route": "SR-108", "direction": "East", "inService": true, "pages": [["SONORA PASS", "OPEN", ""], ["TIOGA PASS", "OPEN", ""]]}}},
                      {"type": "Feature", "geometry": {"type": "Point", "coordinates": [-120.65032, 38.4077]}, "properties": {"id": "cms:10:V80", "layer": "MESSAGE_SIGN", "kind": "Message sign", "category": "blank", "severity": "INFO", "severityRank": 0, "headline": "Sign is blank", "effective": "2026-11-07T01:40:02Z", "areaLabel": "EB 88 E/O PINE GROVE", "source": {"id": "caltrans", "name": "Caltrans", "attribution": "cwwp2.dot.ca.gov"}, "messageSign": {"signId": "V80", "district": 10, "route": "SR-88", "direction": "East", "inService": true}}}],
                      "metadata": {"layer": "message_sign", "area": "ebbetts-pass", "generatedAt": "2026-11-07T04:03:24Z", "sourceStatus": "OK", "attribution": "cwwp2.dot.ca.gov · quickmap.dot.ca.gov", "schemaVersion": 1}}
                  weather_alert:
                    summary: weather_alert - Illustrative, shaped from a September 2026 Heat Advisory
                    value: {"type": "FeatureCollection", "features": [
                      {"type": "Feature", "geometry": null, "properties": {"id": "wx:urn:oid:2.49.0.1.840.0.842def7567d1cdba53e97af002d08acc9cc69f61.001.1", "layer": "WEATHER_ALERT", "kind": "Weather alert", "category": "Heat Advisory", "severity": "MODERATE", "severityRank": 2, "headline": "Heat Advisory", "description": "* WHAT...High temperatures 97 to 104 and low temperatures 65 to 75 expected, with widespread Moderate HeatRisk and areas of Major HeatRisk.", "summary": "Hot temperatures (highs 97–104°F, lows 65–75°F) expected from 10 AM Wednesday to 10 PM PDT Thursday.", "summaryEnhanced": {"enhancedAt": "2026-09-09T17:01:25Z"}, "status": "ACTIVE", "effective": "2026-09-09T17:00:00Z", "expires": "2026-09-11T05:00:00Z", "source": {"id": "nws", "name": "NWS Sacramento CA"}, "weather": {"event": "Heat Advisory", "source": "NWS", "zones": ["CAZ137"], "nwsSeverity": "Moderate", "certainty": "Likely", "urgency": "Expected", "instruction": "Drink plenty of fluids, stay in an air-conditioned room, stay out of the sun, and check up on relatives and neighbors."}}}],
                      "metadata": {"layer": "weather_alert", "area": "ebbetts-pass", "generatedAt": "2026-09-09T17:05:00Z", "sourceStatus": "OK", "attribution": "NOAA / National Weather Service", "schemaVersion": 1}}
                  fire_weather:
                    summary: fire_weather - the region banner and one forecast point
