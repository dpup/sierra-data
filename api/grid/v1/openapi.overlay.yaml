    /api/v1/ingest/{stream}:
      post:
        tags: [Ingest]
        operationId: IngestReport
        summary: Push a monitor's report (authenticated)
        description: |
          The only write endpoint, for operator-run monitors (see
          docs/mesh-reporter-guide.md). Each reporter is granted specific streams.
          A report is validated and queued (202), not stored synchronously: the
          ingest scheduler merges it on its next tick, and no request writes an
          event directly.

          Checks run in this order and nothing in the body is read before the
          caller is known: bearer token (401) -> stream exists (404) -> reporter
          granted the stream (403) -> rate limit (429) -> body size (413) ->
          payload (400). A malformed envelope rejects the whole report; a bad
          entry is skipped and named in `warnings`.

          **Limits.** One accepted report per reporter per stream every 15
          seconds by default (measured from the last ACCEPTED report, so rejected
          retries never lock you out); 1 MiB body; 1000 entries. Retries are
          safe: entries are keyed by node or line.

          **Preflight.** `?preflight=true` checks the token and grant only and
          answers 204, recording nothing (no rate-limit or health effect). Use it
          before expensive work such as placing a phone call.

          Errors use the same `rpcStatus` envelope as every other route. Any
          method other than POST answers `405` with `Allow: POST` (body code 12,
          `UNIMPLEMENTED`).

          Not callable from a browser cross-origin (CORS allows GET only). The
          route is mounted only when the deployment configures reporters.
        security:
          - ingestBearer: []
        parameters:
          - name: stream
            in: path
            required: true
            description: "Payload contract. `mesh.repeater`: repeater admin telemetry (MeshRepeaterReport). `mesh.packet`: forwarded raw MeshCore frames (MeshPacketReport). `burn.line`: county burn-day phone readings (BurnLineReport)."
            schema: {type: string, enum: [mesh.repeater, mesh.packet, burn.line]}
          - name: preflight
            in: query
            required: false
            description: "`true`: validate credentials and the stream grant only, then answer 204."
            schema: {type: boolean}
        requestBody:
          required: true
          description: The stream's payload, snake_case JSON. Pick the schema by the `stream` path parameter.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/MeshRepeaterReport"}
                  - {$ref: "#/components/schemas/MeshPacketReport"}
                  - {$ref: "#/components/schemas/BurnLineReport"}
              examples:
                mesh.repeater:
                  summary: mesh.repeater - one node read, one unreachable
                  value: {"schema_version": 1, "generated_at": "2026-09-15T00:23:32Z", "repeaters": [
                    {"id": "de0715314cfa9b5e", "name": "SIERRA Arnold Summit", "last_attempt": 1789431672, "last_success": 1789431672, "battery_voltage": 4.14, "battery_percent": 97.0, "battery_percent_source": "estimated", "temperature_c": 37.0, "humidity": null, "pressure": null, "uptime_s": 2615083, "airtime_ms": 49646, "rx_airtime_ms": 211238, "noise_floor_dbm": -116, "last_rssi_dbm": -88, "last_snr_db": 12.5, "tx_queue_len": 0, "nb_sent": 150305, "nb_recv": 649331, "recv_errors": 240197, "online": true},
                    {"id": "6781a18b2b47cb4e", "name": "SIERRA Lilac Park", "last_attempt": 1789421128, "last_success": null, "battery_voltage": null, "battery_percent": null, "temperature_c": null, "uptime_s": null, "nb_sent": null, "online": false}]}
                mesh.packet:
                  summary: mesh.packet - one forwarded ADVERT (raw frame truncated)
                  value: {"schema_version": 1, "generated_at": "2026-10-09T05:00:00Z", "observer": "e3635c65dcd443e7982d2f2ddbd02853d02c195dd2c9be071b7ec3ab01b0d609", "packets": [
                    {"packet_type": 4, "raw": "11001148edae55676cd38008283a6236e9452f48ab074a85", "SNR": 8.5, "RSSI": -95, "timestamp": "2026-10-09T04:58:12Z"}]}
                burn.line:
                  summary: burn.line - one Calaveras reading
                  value: {"schema_version": 1, "generated_at": "2026-11-06T15:02:10Z", "readings": [
                    {"line_id": "calaveras", "status": "green", "message": "Today is a permissive burn day.", "cleaned_transcription": "Today, Friday November 6th, is a permissive burn day in Calaveras County.", "confidence": 95, "observed_at": "2026-11-06T15:01:40Z"}]}
        responses:
          "202":
            description: Validated and queued.
            content:
              application/json:
                schema: {$ref: "#/components/schemas/IngestAccepted"}
                examples:
                  accepted:
                    value: {"reporterId": "alanpi", "stream": "mesh.repeater", "accepted": 9, "receivedAt": "2026-09-15T00:23:35Z"}
                  withWarnings:
                    value: {"reporterId": "alanpi", "stream": "mesh.repeater", "accepted": 8, "warnings": ["repeaters[3]: id \"nothex!!\" is not 8-64 hex characters; skipped"], "receivedAt": "2026-09-15T00:23:35Z"}
          "204":
            description: "`?preflight=true` and the token is granted this stream. No body."
          "400":
            description: Malformed JSON, wrong `schema_version`, too many entries, no usable entries, or the stream is not enabled on this server. Do not retry unchanged.
            content:
              application/json:
                schema: {$ref: "#/components/schemas/rpcStatus"}
                examples:
                  schemaVersion: {value: {"code": 3, "codeName": "INVALID_ARGUMENT", "message": "unsupported schema_version 2 (want 1)", "details": []}}
                  packetsOff: {value: {"code": 3, "codeName": "INVALID_ARGUMENT", "message": "mesh.packet is not enabled on this server: MeshCore ingest is off", "details": []}}
          "401":
            description: Missing or unrecognized bearer token. Deliberately says nothing more.
            headers:
              WWW-Authenticate:
                schema: {type: string, example: "Bearer realm=\"grid-ingest\""}
            content:
              application/json:
                schema: {$ref: "#/components/schemas/rpcStatus"}
                example: {"code": 16, "codeName": "UNAUTHENTICATED", "message": "unauthorized", "details": []}
          "403":
            description: The token is valid but not granted this stream.
            content:
              application/json:
                schema: {$ref: "#/components/schemas/rpcStatus"}
                example: {"code": 7, "codeName": "PERMISSION_DENIED", "message": "reporter is not authorized for stream \"burn.line\"", "details": []}
          "404":
            description: Unknown stream.
            content:
              application/json:
                schema: {$ref: "#/components/schemas/rpcStatus"}
                example: {"code": 5, "codeName": "NOT_FOUND", "message": "unknown stream \"mesh.repeaters\"", "details": []}
          "413":
            description: Body over the size limit (1 MiB by default).
            content:
              application/json:
                schema: {$ref: "#/components/schemas/rpcStatus"}
                example: {"code": 3, "codeName": "INVALID_ARGUMENT", "message": "body exceeds 1048576 bytes", "details": []}
          "429":
            description: Reporting faster than the reporter's minimum interval. Wait `Retry-After` seconds.
            headers:
              Retry-After: {$ref: "#/components/headers/RetryAfter"}
            content:
              application/json:
                schema: {$ref: "#/components/schemas/rpcStatus"}
                example: {"code": 8, "codeName": "RESOURCE_EXHAUSTED", "message": "reporting faster than the configured minimum interval of 15s", "details": []}
          "503": {$ref: "#/components/responses/HandoffUnavailable"}

    /mcp:
      post:
        tags: [MCP]
        operationId: Mcp
        summary: Model Context Protocol (JSON-RPC 2.0 over Streamable HTTP)
        description: |
          A read-only MCP server (protocol revision `2025-06-18`, server name
          `sierra-grid`) for LLM agents. Stateless request/response: POST one
          JSON-RPC message, get one JSON response (no SSE stream, no session id).
          A notification (no `id`) is answered `202` with no body. Any other HTTP
          method is `405`. Tools call this same `/api/v1` surface in-process and
          every result carries a reference-only disclaimer.

          Tools (`tools/list` for their input schemas):
          - `grid_situation`: what is happening at a place, address or lat,lng
            (mode, per-domain status, top headlines). Start here.
          - `grid_events`: list events, filtered by location, layer, severity,
            status and time.
          - `grid_event`: one event in full, by id.
          - `grid_conditions`: current weather and fire-weather state.
          - `grid_resolve`: address or lat,lng to the places containing it.
          - `grid_places`: the place directory.
          - `grid_sources`: feed health.
          - `grid_history`: revisions over a time range.

          Resource `grid://reference` (the API reference, Markdown); prompt
          `hazard_briefing(location)`.

          Not callable from a browser cross-origin (CORS allows GET only).
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JsonRpcRequest"}
              examples:
                toolsList:
                  value: {"jsonrpc": "2.0", "id": 1, "method": "tools/list"}
                situation:
