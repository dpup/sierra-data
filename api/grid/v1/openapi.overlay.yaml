    /api/v1/mesh/links:
      get:
        tags: [Mesh]
        operationId: ListMeshLinks
        summary: The MeshCore relay topology, as an edge list
        description: |
          Every undirected relay link observed within `window`, mesh-wide (not
          place-scoped: a mesh spans places). Nodes are identified by public key;
          to draw a link, join `a` and `b` to `properties.mesh.publicKey` on the
          `mesh_node` map layer (or `mesh.publicKey` on `layer=MESH` events) for
          coordinates. For a place-scoped, ready-to-draw version use the
          `mesh_link` map layer. Weight edges by `daysActive`, fade by `lastSeen`.

          `Cache-Control: public, max-age=60` and a weak `ETag` (`W/"…"`) that
          excludes `generatedAt`: `If-None-Match` revalidates to `304` until the
          links change.
        parameters:
          - {$ref: "#/components/parameters/MeshWindow"}
          - {$ref: "#/components/parameters/IfNoneMatch"}
        responses:
          "200":
            description: The links, possibly empty.
            headers:
              ETag: {$ref: "#/components/headers/ETag"}
              Cache-Control: {$ref: "#/components/headers/CacheControl"}
            content:
              application/json:
                schema: {$ref: "#/components/schemas/MeshLinkList"}
                example: {"window": "72h", "generatedAt": "2026-11-07T04:03:33Z", "links": [
                  {"a": "1000009e310d729534b70faa33a1abe5cd5e45d594f72f786febccbb770b7e74", "b": "6942089f5f77fa347c8f9c0b27cb8d0b2227c0b845a212259fd1401a3f96a0eb", "observations": 3164, "daysActive": 4, "firstSeen": "2026-11-04T01:46:19Z", "lastSeen": "2026-11-07T04:02:21Z", "bestSnr": 13.3},
                  {"a": "1000009e310d729534b70faa33a1abe5cd5e45d594f72f786febccbb770b7e74", "b": "c38f9962660d46617418a38abd099ad2927abde3ff784005fecffce33af1a862", "observations": 2416, "daysActive": 4, "firstSeen": "2026-11-04T00:01:19Z", "lastSeen": "2026-11-07T03:57:05Z", "bestSnr": 13.25}]}
          "304": {$ref: "#/components/responses/NotModified"}
          "400": {$ref: "#/components/responses/InvalidWindow"}
