<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mesh Relay Status</title>
<style>
  :root { --bg:#fff; --fg:#1b1f23; --muted:#6a737d; --line:#e1e4e8; --ok:#1a7f37; --bad:#cf222e; --warn:#9a6700; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --ok:#3fb950; --bad:#f85149; --warn:#d29922; }
  }
  body { background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, sans-serif; margin:0; padding:16px; }
  main { max-width:960px; margin:0 auto; }
  h1 { font-size:18px; margin:0 0 12px; }
  form { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  input { flex:1; min-width:200px; padding:6px 8px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:4px; font:inherit; }
  button { padding:6px 12px; border:1px solid var(--line); border-radius:4px; background:transparent; color:var(--fg); font:inherit; cursor:pointer; }
  .wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; }
  .online { color:var(--ok); } .offline { color:var(--bad); } .mismatch { color:var(--warn); }
  #msg { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Mesh Relay</h1>
  <form id="f">
    <input id="tok" type="password" autocomplete="off" placeholder="client token (smc_…)" aria-label="client token">
    <button type="submit">Load</button>
  </form>
  <p id="msg">Paste a client token to load gateway status. It is kept in this tab only.</p>
  <div class="wrap"><table id="t" hidden>
    <thead><tr><th>Gateway</th><th>Bridge</th><th>Node</th><th>Pubkey</th><th>Last seen</th><th>Agent</th><th>Lease</th></tr></thead>
    <tbody></tbody>
  </table></div>
</main>
<script>
(function () {
  var tokEl = document.getElementById('tok'), msg = document.getElementById('msg'),
      table = document.getElementById('t'), body = table.querySelector('tbody'), timer = null;
  try { tokEl.value = sessionStorage.getItem('relayToken') || ''; } catch (e) {}
  function cell(tr, text, cls) { var td = document.createElement('td'); td.textContent = text; if (cls) td.className = cls; tr.appendChild(td); }
  function ago(iso) {
    if (!iso) return '—';
    var s = Math.round((Date.now() - Date.parse(iso)) / 1000);
    if (s < 60) return s + 's ago'; if (s < 3600) return Math.round(s / 60) + 'm ago';
    if (s < 86400) return Math.round(s / 3600) + 'h ago'; return Math.round(s / 86400) + 'd ago';
  }
  function load() {
    var tok = tokEl.value.trim();
    if (!tok) return;
    fetch('api/gateways', { headers: { Authorization: 'Bearer ' + tok } }).then(function (r) {
      if (!r.ok) throw new Error(r.status === 401 ? 'Token rejected.' : 'HTTP ' + r.status);
      return r.json();
    }).then(function (data) {
      body.textContent = '';
      (data.gateways || []).forEach(function (g) {
        var tr = document.createElement('tr');
        cell(tr, g.name);
        cell(tr, g.online ? 'online' : 'offline', g.online ? 'online' : 'offline');
        cell(tr, g.node ? g.node.state : '—', g.node && g.node.state === 'mismatch' ? 'mismatch' : '');
        cell(tr, g.pubkey_status, g.pubkey_status === 'mismatch' ? 'mismatch' : '');
        cell(tr, ago(g.last_seen));
        cell(tr, g.agent ? (g.agent.version || '') + ' ' + (g.agent.os || '') + '/' + (g.agent.arch || '') : '—');
        cell(tr, g.lease ? g.lease.client : '—');
        body.appendChild(tr);
      });
      table.hidden = false;
      msg.textContent = (data.gateways || []).length + ' gateway(s) · refreshed ' + new Date().toLocaleTimeString();
    }).catch(function (e) { msg.textContent = e.message; });
  }
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    try { sessionStorage.setItem('relayToken', tokEl.value.trim()); } catch (err) {}
    load();
    clearInterval(timer); timer = setInterval(load, 15000);
  });
  if (tokEl.value) { load(); timer = setInterval(load, 15000); }
})();
</script>
</body>
</html>
