server:
  port: 8181  # Local dev port. Production (Docker/ECS) overrides via PF__SERVER__PORT=8080.
  security:
    xFrameOptions: DENY  # X-Frame-Options header

    # CORS settings
    # NOTE: Prefab only emits Access-Control-Allow-Origin when the request's
    # Origin header exactly matches an entry below (see prefab security.go).
    # Browser clients must be listed here explicitly to make cross-origin fetch work.
    corsOrigins:
      - https://ersn.net
      - https://www.ersn.net         # ersn.net site (www host is a distinct origin)
      - https://sierragridteam.org   # S.I.E.R.R.A site consuming /roads, /weather, /weather/alerts (issue #3)
      - https://www.sierragridteam.org
      - http://localhost:8181
      - http://localhost:4321
      - http://localhost:4322
    # NOTE: keys must be corsAllowMethods / corsAllowHeaders (no "ed") - those are
    # what Prefab reads (server.security.corsAllowMethods). The misspelled
    # corsAllowedMethods/corsAllowedHeaders were silently ignored, leaving the
    # permissive defaults (all methods) in place.
    corsAllowMethods:
      - GET
    corsAllowHeaders:
      - content-type
      - x-requested-with
      - x-csrf-protection
    # This API requires no authentication and uses no cookies, so credentialed
    # CORS is unnecessary. Keeping it false also leaves the door open to a
    # wildcard origin later if desired.
    corsAllowCredentials: false
    corsMaxAge: 72h

    # HSTS settings
    hstsExpiration: 31536000s
    hstsIncludeSubdomains: true
    hstsPreload: true

# Client Configurations - Top Level  
google_routes:
  apiKey: "" 

openai:
  apiKey: ""
  # Model for alert/incident enhancement. Must support JSON-schema structured
  # outputs. gpt-5-family models run with reasoning_effort=low (see
  # internal/lib/alerts/enhancer.go for the gpt-5 param compatibility notes).
  model: "gpt-5-mini"
  timeout: "30s"             # Timeout for API calls
  maxRetries: 3              # Maximum retry attempts

openweather:
  apiKey: ""

# Service Configurations
roads:
  # Google Routes calls are gated by a 45m per-road cache (see roads.go), not this
  # interval, to stay under the Compute Routes Pro free tier (5,000/month). The
  # request uses TRAFFIC_AWARE_OPTIMAL (Pro) but NOT traffic-on-polyline (Enterprise).
  refreshInterval: "15m"  # Cache TTL; stale data is servable until 2x this, then evicted.
  
  caltransFeeds:
    laneClosures:
      refreshInterval: "10m"
      url: "https://quickmap.dot.ca.gov/data/lcs2way.kml"
    chpIncidents:
      refreshInterval: "5m"   # More frequent, incidents change quickly
      url: "https://quickmap.dot.ca.gov/data/chp-only.kml"
    roadConditions:
      refreshInterval: "10m"  # Caltrans road conditions page (closures, chain controls)
      url: "https://roads.dot.ca.gov/roadscell.php?roadnumber=%s"

  # Named regions for the region-wide incidents feed (issue #7):
  #   GET /api/v1/incidents/mother-lode
  # The CHP/Caltrans KML feeds are statewide; bounds keep this scoped to the
  # Gold Country foothills (Amador/Calaveras/Tuolumne/Mariposa/El Dorado),
  # excluding the Central Valley floor (Stockton/Sacramento/Modesto).
  incidentAreas:
    - id: "mother-lode"
      name: "Mother Lode"
      bounds:
        minLatitude: 37.3
        maxLatitude: 39.0
        minLongitude: -121.15
        maxLongitude: -119.5

  monitoredRoads:
    - name: "Hwy 4"
      section: "Angels Camp to Murphys"
      id: "hwy4-angels-murphys"
      origin:
        latitude: 38.067400
        longitude: -120.540200
      destination:
        latitude: 38.139117
        longitude: -120.456111
      locationKeywords: ["Vallecito", "Douglas Flat", "Copperopolis"]
    - name: "Hwy 4"
      section: "Murphys to Arnold"
      id: "hwy4-murphys-arnold"
      origin:
        latitude: 38.139117
        longitude: -120.456111
      destination:
        latitude: 38.265006
        longitude: -120.333654
      locationKeywords: ["Avery", "Hathaway Pines"]
    - name: "Hwy 4"
      section: "Arnold to Bear Valley"
      id: "hwy4-arnold-bearvalley"
      origin:
        latitude: 38.265006
        longitude: -120.333654
      destination:
        latitude: 38.461045
        longitude: -120.042368
      locationKeywords: ["Camp Connell", "Dorrington", "White Pines", "Big Trees", "Ganns", "Tamarack", "Lake Alpine", "Mt Reba", "Ebbetts"]
    # Hwy 49 / Tuolumne corridor (issue #6). Angels Camp <-> Sonora links the
    # Calaveras and Tuolumne service areas. Note: the upper Hwy 4 segment past
    # Arnold (Dorrington) is already covered by "Arnold to Bear Valley" above,
    # which Google routes through Dorrington.
    - name: "Hwy 49"
      section: "Angels Camp to Sonora"
      id: "hwy49-angels-sonora"
      origin:
        latitude: 38.067400
        longitude: -120.540200
      destination:
        latitude: 37.984100
        longitude: -120.382700
    # Useful for testing because it is always busy and often has incidents.
    # - name: "101"
    #   section: "SF to Oakland"
    #   id: "101-sf-oakland"
    #   origin:
    #     latitude: 37.774929
    #     longitude: -122.419418
    #   destination:
    #     latitude: 37.792769
    #     longitude: -122.262866

weather:
  # OpenWeather budget: current conditions only (/data/2.5/weather), one call
  # per location per refresh, request-driven. 7 locations at 15m ≈ 672 calls/day
  # worst case. Alerts come from NWS (free) — the One Call 3.0 endpoint
  # (1,000/day cap) is deliberately unused; see internal/clients/weather.
  refreshInterval: "15m"  # Cache TTL; stale data is servable until 2x this, then evicted.

  # National Weather Service zone alerts (issue #4) + fire-weather
  # classification (issue #5). These foothill/mountain zones cover the
  # Calaveras & Tuolumne service area. NWS requires a descriptive User-Agent
  # (no API key). See https://www.weather.gov/documentation/services-web-api
  nws:
    userAgent: "The Grid / S.I.E.R.R.A (https://data.sierragridteam.org)"
    zones:
      - CAZ064   # Calaveras foothills
      - CAZ065   # Calaveras mountains
      - CAZ258   # Tuolumne foothills
      - CAZ259   # Tuolumne mountains

  # Each location costs one /data/2.5/weather call per refresh interval (see
  # budget note above) — adding locations scales API usage linearly.
  # `zone` is the NWS forecast zone containing the location (must be listed in
  # nws.zones above); it scopes which NWS alerts attach to the location.
  # Assignments are elevation-based: foothill towns → CAZ064/258, mountain
  # towns → CAZ065/259.
  locations:
    - id: "murphys"
      name: "Murphys, CA"
      zone: "CAZ064"
      coordinates:
        latitude: 38.139117
        longitude: -120.456111
    - id: "arnold"
      name: "Arnold, CA"
      zone: "CAZ065"
      coordinates:
        latitude: 38.265006
        longitude: -120.333654
    - id: "bearvalley"
      name: "Bear Valley, CA"
      # Bear Valley sits just over the Alpine County line; CAZ065 (Calaveras
      # mountains) is the nearest configured zone and shares its weather.
      zone: "CAZ065"
      coordinates:
        latitude: 38.461045
        longitude: -120.042368
    # Hwy 49 / Tuolumne corridor towns (issue #6).
    - id: "sonora"
      name: "Sonora, CA"
      zone: "CAZ258"
      coordinates:
        latitude: 37.984100
        longitude: -120.382700
    - id: "columbia"
      name: "Columbia, CA"
      zone: "CAZ258"
      coordinates:
        latitude: 38.034900
        longitude: -120.401600
    - id: "twainharte"
      name: "Twain Harte, CA"
      zone: "CAZ259"
      coordinates:
        latitude: 38.038300
        longitude: -120.229400
    - id: "dorrington"
      name: "Dorrington, CA"
      zone: "CAZ065"
      coordinates:
        latitude: 38.333800
        longitude: -120.271300

# Unified hazard/situation feed (docs/hazard-aggregation-design.md). Powers
# GET /api/v1/hazards/{area}/{layer}.geojson — standardized GeoJSON for map clients.
hazards:
  areas:
    - id: "ebbetts-pass"
      name: "Ebbetts Pass Corridor"
      # The SIERRA Grid team's coverage footprint deliberately OVERLAPS SEVERAL
      # COUNTIES — that's why an AREA is its own place kind, not a county. This
      # bbox is a coarse first cut: it's roughly square, reaching up past San
      # Andreas to Jackson (Amador) and almost down to Farmington (San Joaquin),
      # so it spills beyond the Calaveras+Tuolumne core. Fine for now; a hand-
      # drawn polygon boundary (checked into data/places/, like the county
      # polygons, and referenced here) is the intended cleaner-boundary refinement.
      bounds:
        minLatitude: 37.8
        maxLatitude: 38.55
        minLongitude: -120.9
        maxLongitude: -120.0
      incidentArea: "mother-lode"   # reuse the roads incidents region filter
      # NWS forecast zones this area covers — scopes the weather_alert and
      # fire_weather layers (which carry zones, not coordinates). The Hwy 4 + Hwy
      # 49 corridor spans Calaveras and Tuolumne, so all four service zones apply.
      zones: ["CAZ064", "CAZ065", "CAZ258", "CAZ259"]
      # Evacuation zones are filtered by the bounds above (spatial query), so any
      # in-area zone is caught regardless of which county Cal OES tags it to.
      scannerFeeds:
        - { feedId: "13524", channelLabel: "Sheriff / CAL FIRE Dispatch", agency: "Calaveras SO / CAL FIRE" }
        - { feedId: "28469", channelLabel: "Fire / USFS", agency: "CAL FIRE / USFS" }
        - { feedId: "41042", channelLabel: "CAL FIRE TCU / USFS", agency: "CAL FIRE TCU" }
        - { feedId: "45443", channelLabel: "CHP — Stockton", agency: "CHP" }

# Grid event store + ingest scheduler (docs/v2-implementation-plan.md). The
# scheduler polls each upstream, persists events with revision history in
# SQLite, and derives per-source health for /v1/sources.
grid:
  # SQLite database. Local dev writes under ./data (git-ignored); production
  # points at the persistent mount via PF__GRID__DBPATH=/data/grid.db.
  dbPath: "./data/grid.db"

  # SQLite journal mode. TRUNCATE works on both local disk and a network
  # filesystem (NFS/EFS) and is the safe default. WAL is faster for concurrent
  # reads but its memory-mapped -shm sidecar does NOT work over NFS/EFS — use it
  # only on a real local disk. TRUNCATE/DELETE/PERSIST run with synchronous=FULL
  # (crash-safe rollback journal); WAL runs with synchronous=NORMAL.
  # Override per environment via PF__GRID__JOURNALMODE.
  journalMode: "TRUNCATE"

  # NWS weather-alert AI enhancement (condense + localize; spec §3.1 — the
  # enhancer translates, never asserts). budgetPerTick caps OpenAI calls per
  # scheduler tick: enhancement only triggers on content change, so cost
  # scales with alert churn, not poll rate; alerts deferred by the budget are
  # picked up on their next content change. Disabled automatically when no
  # OpenAI key is configured.
  enhancement:
    enabled: true
    budgetPerTick: 5

  # Per-source poll cadence + lifecycle policy. A poller may update several
  # source rows (wildfire tick -> calfire + wfigs; incidents tick -> chp +
  # caltrans; the poller runs at the fastest of its sources' intervals).
  #
  # disappearance says what happens when an event vanishes from its feed:
  #   resolve — the feed authoritatively lists everything active (Cal OES,
  #             CAL FIRE, CHP, Caltrans), so missing IS the all-clear: the
  #             event transitions to RESOLVED (a recorded revision — the
  #             all-clear is part of history).
  #   expire  — the feed going quiet proves nothing (an NWS alert drops out
  #             at end-of-product, WFIGS perimeters lag): the event only
  #             transitions to EXPIRED once past its own `expires` time or
  #             the expireAfter grace; otherwise it stays active.
  # Either way a failed poll NEVER transitions events — an error must never
  # become an all-clear (the evac fail-loud invariant).
  #
  # staleAfter is omitted everywhere: the store defaults it to 3x the poll
  # interval (health degrades OK -> STALE -> UNAVAILABLE as failures age).
  sources:
    usgs:
      pollInterval: "5m"
      # A quake aging out of the 7-day M2.5+ query window is its natural end
      # of life; the window is authoritative for "current", so resolve.
      disappearance: "resolve"
    calfire:
      pollInterval: "5m"
      disappearance: "resolve"
    wfigs:
      pollInterval: "5m"
      # Perimeter uploads lag the fire; a perimeter missing from one poll is
      # not containment. Expire only after a day without reappearing.
      disappearance: "expire"
      expireAfter: "24h"
    caloes:
      # Life-safety layer: evacuation orders must appear (and clear) fast, so
      # this polls at the shortest interval.
      pollInterval: "2m"
      disappearance: "resolve"
    nws:
      pollInterval: "5m"
      # Alerts carry their own `expires`; the grace covers the rare product
      # issued without one so it can't linger active forever.
      disappearance: "expire"
      expireAfter: "24h"
    chp:
      pollInterval: "5m"
      disappearance: "resolve"
    caltrans:
      # Lane closures are scheduled operations; the upstream feed refreshes
      # on a 10m cadence, so polling faster just re-reads the same data.
      pollInterval: "10m"
      disappearance: "resolve"