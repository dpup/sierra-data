server:
  port: 8181  # Local dev port. Production (Docker/ECS) overrides via PF__SERVER__PORT=8080.
  security:
    xFramesOptions: DENY  # X-Frame-Options header (prefab reads xFramesOptions, plural)

    # CORS settings
    # NOTE: Prefab only emits Access-Control-Allow-Origin when the request's
    # Origin header exactly matches an entry below (see prefab security.go).
    # Browser clients must be listed here explicitly to make cross-origin fetch work.
    corsOrigins:
      - https://ersn.net
      - https://www.ersn.net         # ersn.net site (www host is a distinct origin)
      - https://sierragridteam.org   # S.I.E.R.R.A site consuming /roads, /weather, /weather/alerts (issue #3)
      - https://www.sierragridteam.org
      - http://localhost:8181
      - http://localhost:4321
      - http://localhost:4322
    # NOTE: keys must be corsAllowMethods / corsAllowHeaders (no "ed") - those are
    # what Prefab reads (server.security.corsAllowMethods). The misspelled
    # corsAllowedMethods/corsAllowedHeaders were silently ignored, leaving the
    # permissive defaults (all methods) in place.
    corsAllowMethods:
      - GET
    corsAllowHeaders:
      - content-type
      - x-requested-with
      - x-csrf-protection
    # This API requires no authentication and uses no cookies, so credentialed
    # CORS is unnecessary. Keeping it false also leaves the door open to a
    # wildcard origin later if desired.
    corsAllowCredentials: false
    corsMaxAge: 72h

    # HSTS settings
    hstsExpiration: 31536000s
    hstsIncludeSubdomains: true
    hstsPreload: true

# Client Configurations - Top Level  
google_routes:
  apiKey: "" 

openai:
  apiKey: ""
  # Model for alert/incident enhancement. Must support JSON-schema structured
  # outputs. gpt-5-family models run with reasoning_effort=low (see
  # internal/lib/alerts/enhancer.go for the gpt-5 param compatibility notes).
  model: "gpt-5-mini"
  timeout: "30s"             # Timeout for API calls
  maxRetries: 3              # Maximum retry attempts

openweather:
  apiKey: ""

# Service Configurations
roads:
  # Google Routes calls are gated by a 45m per-road cache (see roads.go), not this
  # interval, to stay under the Compute Routes Pro free tier (5,000/month). The
  # request uses TRAFFIC_AWARE_OPTIMAL (Pro) but NOT traffic-on-polyline (Enterprise).
  refreshInterval: "15m"  # Cache TTL; stale data is servable until 2x this, then evicted.
  
  caltransFeeds:
    laneClosures:
      refreshInterval: "10m"
      url: "https://quickmap.dot.ca.gov/data/lcs2way.kml"
    chpIncidents:
      refreshInterval: "5m"   # More frequent, incidents change quickly
      url: "https://quickmap.dot.ca.gov/data/chp-only.kml"
    roadConditions:
      refreshInterval: "10m"  # Caltrans road conditions page (closures, chain controls)
      url: "https://roads.dot.ca.gov/roadscell.php?roadnumber=%s"

  # Named regions for the region-wide incidents feed (issue #7):
  #   GET /api/v1/incidents/mother-lode
  # The CHP/Caltrans KML feeds are statewide; bounds keep this scoped to the
  # Gold Country foothills (Amador/Calaveras/Tuolumne/Mariposa/El Dorado),
  # excluding the Central Valley floor (Stockton/Sacramento/Modesto).
  incidentAreas:
    - id: "mother-lode"
      name: "Mother Lode"
      bounds:
        minLatitude: 37.3
        maxLatitude: 39.0
        minLongitude: -121.15
        maxLongitude: -119.5

  monitoredRoads:
    - name: "Hwy 4"
      section: "Angels Camp to Murphys"
      id: "hwy4-angels-murphys"
      origin:
        latitude: 38.067400
        longitude: -120.540200
      destination:
        latitude: 38.139117
        longitude: -120.456111
      locationKeywords: ["Vallecito", "Douglas Flat", "Copperopolis"]
    - name: "Hwy 4"
      section: "Murphys to Arnold"
      id: "hwy4-murphys-arnold"
      origin:
        latitude: 38.139117
        longitude: -120.456111
      destination:
        latitude: 38.265006
        longitude: -120.333654
      locationKeywords: ["Avery", "Hathaway Pines"]
    - name: "Hwy 4"
      section: "Arnold to Bear Valley"
      id: "hwy4-arnold-bearvalley"
      origin:
        latitude: 38.265006
        longitude: -120.333654
      destination:
        latitude: 38.461045
        longitude: -120.042368
      locationKeywords: ["Camp Connell", "Dorrington", "White Pines", "Big Trees", "Ganns", "Tamarack", "Lake Alpine", "Mt Reba", "Ebbetts"]
    # Hwy 49 / Tuolumne corridor (issue #6). Angels Camp <-> Sonora links the
    # Calaveras and Tuolumne service areas. Note: the upper Hwy 4 segment past
    # Arnold (Dorrington) is already covered by "Arnold to Bear Valley" above,
    # which Google routes through Dorrington.
    - name: "Hwy 49"
      section: "Angels Camp to Sonora"
      id: "hwy49-angels-sonora"
      origin:
        latitude: 38.067400
        longitude: -120.540200
      destination:
        latitude: 37.984100
        longitude: -120.382700
    # Useful for testing because it is always busy and often has incidents.
    # - name: "101"
    #   section: "SF to Oakland"
    #   id: "101-sf-oakland"
    #   origin:
    #     latitude: 37.774929
    #     longitude: -122.419418
    #   destination:
    #     latitude: 37.792769
    #     longitude: -122.262866

weather:
  # OpenWeather budget: current conditions only (/data/2.5/weather), one call
  # per location per refresh, request-driven. 7 locations at 15m ≈ 672 calls/day
  # worst case. Alerts come from NWS (free) — the One Call 3.0 endpoint
  # (1,000/day cap) is deliberately unused; see internal/clients/weather.
  refreshInterval: "15m"  # Cache TTL; stale data is servable until 2x this, then evicted.

  # Per-location fire-weather FORECAST (wind/gust/RH out 48h) from the NWS
  # gridpoint API (keyless, reuses nws.userAgent). Surfaced on /api/v1/conditions
  # (forecast[]) and as per-location points on the fire_weather map layer —
  # informational, never an issued Red Flag. See docs/fire-weather-forecast-design.md.
  # The static /points->grid mapping is resolved once per location; the grid
  # refreshes on refreshInterval (~168 keyless calls/day for 7 locations).
  forecast:
    enabled: true
    refreshInterval: "1h"
    horizonHours: 48

  # National Weather Service zone alerts (issue #4) + fire-weather
  # classification (issue #5). These foothill/mountain zones cover the
  # Calaveras & Tuolumne service area. NWS requires a descriptive User-Agent
  # (no API key). See https://www.weather.gov/documentation/services-web-api
  nws:
    userAgent: "The Grid / S.I.E.R.R.A (https://data.sierragridteam.org)"
    # NWS Sacramento (STO) elevation-banded zones covering the Calaveras &
    # Tuolumne service area. NOTE: verify any zone with
    # api.weather.gov/points/{lat},{lng} — the previous codes (CAZ064/065/258/259)
    # were wrong: CAZ065 is "San Gorgonio Pass Near Banning" (SoCal, office SGX)
    # and leaked an Extreme Heat Warning; CAZ258/259 don't exist.
    zones:
      - CAZ137   # Southern Motherlode 1000-3000 ft (Calaveras/Tuolumne foothills)
      - CAZ138   # Sierra Nevada of Calaveras & Tuolumne 3000-5000 ft
      - CAZ139   # Sierra Nevada of Calaveras-Tuolumne-S. Alpine above 5000 ft

  # Each location costs one /data/2.5/weather call per refresh interval (see
  # budget note above) — adding locations scales API usage linearly.
  # `zone` is the NWS forecast zone containing the location (must be listed in
  # nws.zones above); it scopes which NWS alerts attach to the location.
  # Assignments are elevation-based: 1000-3000 ft → CAZ137, 3000-5000 ft →
  # CAZ138, above 5000 ft → CAZ139 (each verified via api.weather.gov/points).
  locations:
    - id: "murphys"
      name: "Murphys, CA"
      zone: "CAZ137"
      coordinates:
        latitude: 38.139117
        longitude: -120.456111
    - id: "arnold"
      name: "Arnold, CA"
      zone: "CAZ138"
      coordinates:
        latitude: 38.265006
        longitude: -120.333654
    - id: "bearvalley"
      name: "Bear Valley, CA"
      # Bear Valley is just over the Alpine County line at ~7000 ft; CAZ139
      # (Sierra Nevada of Calaveras-Tuolumne-S. Alpine above 5000 ft) is the
      # zone NWS /points returns for it.
      zone: "CAZ139"
      coordinates:
        latitude: 38.461045
        longitude: -120.042368
    # Hwy 49 / Tuolumne corridor towns (issue #6).
    - id: "sonora"
      name: "Sonora, CA"
      zone: "CAZ137"
      coordinates:
        latitude: 37.984100
        longitude: -120.382700
    - id: "columbia"
      name: "Columbia, CA"
      zone: "CAZ137"
      coordinates:
        latitude: 38.034900
        longitude: -120.401600
    - id: "twainharte"
      name: "Twain Harte, CA"
      zone: "CAZ138"
      coordinates:
        latitude: 38.038300
        longitude: -120.229400
    - id: "dorrington"
      name: "Dorrington, CA"
      zone: "CAZ139"
      coordinates:
        latitude: 38.333800
        longitude: -120.271300

# Unified hazard/situation feed (docs/hazard-aggregation-design.md). Powers
# GET /api/v1/hazards/{area}/{layer}.geojson — standardized GeoJSON for map clients.
hazards:
  areas:
    - id: "ebbetts-pass"
      name: "Ebbetts Pass Corridor"
      # The SIERRA Grid team's coverage footprint deliberately OVERLAPS SEVERAL
      # COUNTIES — that's why an AREA is its own place kind, not a county.
      #
      # The precise coverage boundary is a hand-drawn polygon in
      # data/places/areas.geojson (keyed by this id) — west out to San Andreas,
      # south at Angels Camp / New Melones, east meeting Hwy 108 SE of Bear
      # Valley (Pinecrest/Dardanelle), and north capping just above Bear Valley
      # up the Hwy 4 corridor (the NE edge cuts SE to the 108).
      # THAT polygon does the event->area attribution (point-in-polygon) and the
      # map footprint. These `bounds` are now just the coarse FETCH rectangle:
      # they must cover the polygon (the upstream USGS/Cal OES queries and the
      # wildfire/earthquake in-scope filter take a rectangle), so they're set to
      # the polygon's bounding box plus a small margin.
      bounds:
        minLatitude: 37.87
        maxLatitude: 38.59
        minLongitude: -120.72
        maxLongitude: -119.89
      incidentArea: "mother-lode"   # reuse the roads incidents region filter
      # NWS forecast zones this area covers — scopes the weather_alert and
      # fire_weather layers (which carry zones, not coordinates). The Hwy 4 + Hwy
      # 49 corridor spans Calaveras and Tuolumne across the elevation bands.
      zones: ["CAZ137", "CAZ138", "CAZ139"]
      # Evacuation zones are filtered by the bounds above (spatial query), so any
      # in-area zone is caught regardless of which county Cal OES tags it to.
      scannerFeeds:
        - { feedId: "13524", channelLabel: "Sheriff / CAL FIRE Dispatch", agency: "Calaveras SO / CAL FIRE" }
        - { feedId: "28469", channelLabel: "Fire / USFS", agency: "CAL FIRE / USFS" }
        - { feedId: "41042", channelLabel: "CAL FIRE TCU / USFS", agency: "CAL FIRE TCU" }
        - { feedId: "45443", channelLabel: "CHP — Stockton", agency: "CHP" }

# Grid event store + ingest scheduler (docs/v2-implementation-plan.md). The
# scheduler polls each upstream, persists events with revision history in
# SQLite, and derives per-source health for /v1/sources.
grid:
  # SQLite database. Local dev writes under ./data (git-ignored); production
  # points at the persistent mount via PF__GRID__DBPATH=/data/grid.db.
  dbPath: "./data/grid.db"

  # SQLite journal mode. TRUNCATE works on both local disk and a network
  # filesystem (NFS/EFS) and is the safe default. WAL is faster for concurrent
  # reads but its memory-mapped -shm sidecar does NOT work over NFS/EFS — use it
  # only on a real local disk. TRUNCATE/DELETE/PERSIST run with synchronous=FULL
  # (crash-safe rollback journal); WAL runs with synchronous=NORMAL.
  # Override per environment via PF__GRID__JOURNALMODE.
  journalMode: "TRUNCATE"

  # NWS weather-alert AI enhancement (condense + localize; spec §3.1 — the
  # enhancer translates, never asserts). budgetPerTick caps OpenAI calls per
  # scheduler tick: enhancement only triggers on content change, so cost
  # scales with alert churn, not poll rate; alerts deferred by the budget are
  # picked up on their next content change. Disabled automatically when no
  # OpenAI key is configured.
  enhancement:
    enabled: true
    budgetPerTick: 5

  # Per-source poll cadence + lifecycle policy. A poller may update several
  # source rows (wildfire tick -> calfire + firis; incidents tick -> chp +
  # caltrans; the poller runs at the fastest of its sources' intervals).
  #
  # disappearance says what happens when an event vanishes from its feed:
  #   resolve — the feed authoritatively lists everything active (Cal OES,
  #             CAL FIRE, CHP, Caltrans), so missing IS the all-clear: the
  #             event transitions to RESOLVED (a recorded revision — the
  #             all-clear is part of history).
  #   expire  — the feed going quiet proves nothing (an NWS alert drops out
  #             at end-of-product, WFIGS perimeters lag): the event only
  #             transitions to EXPIRED once past its own `expires` time or
  #             the expireAfter grace; otherwise it stays active.
  # Either way a failed poll NEVER transitions events — an error must never
  # become an all-clear (the evac fail-loud invariant).
  #
  # staleAfter is omitted everywhere: the store defaults it to 3x the poll
  # interval (health degrades OK -> STALE -> UNAVAILABLE as failures age).
  sources:
    usgs:
      pollInterval: "5m"
      # A quake aging out of the 7-day M2.5+ query window is its natural end
      # of life; the window is authoritative for "current", so resolve.
      disappearance: "resolve"
    # CAL FIRE + FIRIS share ONE poller (the wildfire normalizer joins incidents
    # with perimeters), which ticks at the FASTER of the two intervals and fetches
    # both each tick — so these move together. The FIRIS perimeter query is gated on
    # the layer's dataLastEditDate (a cheap metadata check). NOTE the gate is a
    # STATEWIDE stamp: in active fire season it advances most ticks (a fire changed
    # somewhere in CA), so the gate mainly saves the expensive query in the
    # off-season; its real protection here is that the combo feed is on CAL FIRE's
    # org, not NIFC's 429-saturated one. The metadata endpoint is CDN-cached ~1h, so
    # perimeter freshness is bounded nearer ~1h than 5m — still hours better than
    # WFIGS (the reason we moved), just not literally 5m. 5m keeps CAL FIRE incident
    # scalars fresh and bounds the gate's detection latency.
    calfire:
      pollInterval: "5m"
      disappearance: "resolve"
    firis:
      pollInterval: "5m"
      # Perimeter uploads lag the fire; a perimeter missing from one poll is
      # not containment. Expire only after a day without reappearing.
      disappearance: "expire"
      expireAfter: "24h"
    caloes:
      # Life-safety layer: evacuation orders must appear (and clear) fast, so
      # this polls at the shortest interval.
      pollInterval: "2m"
      disappearance: "resolve"
    nws:
      pollInterval: "5m"
      # Alerts carry their own `expires`; the grace covers the rare product
      # issued without one so it can't linger active forever.
      disappearance: "expire"
      expireAfter: "24h"
    chp:
      pollInterval: "5m"
      disappearance: "resolve"
    caltrans:
      # Lane closures are scheduled operations; the upstream feed refreshes
      # on a 10m cadence, so polling faster just re-reads the same data.
      pollInterval: "10m"
      disappearance: "resolve"
    meshcore:
      # Cadence for reconciling the in-memory MeshCore node buffer to the store
      # (presence is push-fed over MQTT; this is not an upstream fetch interval).
      pollInterval: "60s"
      # No goodbye packet in a mesh — silence is not proof of absence. Presence is
      # now cadence-aware in the registry (a node stays in the poll snapshot for
      # ~3× its own advert interval; see grid.meshcore.cadence* below), so this
      # expireAfter is just the SHORT uniform safety net the disappearance sweep
      # applies once a node has already left the snapshot. (Was 120h before the
      # topology rework, when a single blunt window covered every node.)
      disappearance: "expire"
      expireAfter: "2h"

  # MeshCore mesh-node presence source. Subscribes to community MQTT bridges,
  # several for resilience; a node heard on more than one collapses to a single
  # event. Disabled by default: MeshCore has no official broker, and read/
  # subscribe access to the community brokers is operator-gated (a device key
  # grants publish-only; subscribing needs an operator-issued username/password).
  # To enable, request a subscriber credential, add brokers (secrets via PF__
  # env), and set enabled: true.
  #
  # NOTE: bayme.sh's public broker (mqtt.bayme.sh, topic msh/US/bayarea) is
  # MESHTASTIC — a different protocol, NOT usable here. MeshCore brokers include
  # mqtt.meshmapper.net, the LetsMesh US/EU servers, and mqttmc01.bostonme.sh
  # (all WSS+TLS :443). meshmapper access: a Region Onboarding form → creds via
  # Discord. For local testing, self-host a broker + a publishing observer.
  meshcore:
    enabled: true
    # Keeps a recently-heard node in each poll snapshot; expireAfter (above), not
    # this, governs real liveness.
    activeWindow: "30m"
    # Drop adverts whose Ed25519 signature fails to verify. Framing confirmed
    # against a live capture (2026-07-17, mqtt.gomesh.dev): the bridge `raw` is
    # the full over-the-air frame, stripped by meshcore.DecodeFrame, after which
    # real adverts verify. On by default so spoofed/corrupt adverts are dropped.
    requireValidSignature: true
    # Cadence-aware presence (docs/mesh-topology-design.md §9). A node stays in the
    # poll snapshot for cadenceK × its own measured inter-advert interval, clamped
    # to [graceFloor, graceCeil]. A node with no cadence yet — a one-shot transient
    # OR any node right after a deploy (the registry restarts empty, so cadence is
    # re-learned from scratch) — gets graceFloor.
    #
    # graceFloor is 14h, just over one backbone-repeater cycle (~12h). This is the
    # key tuning for THIS mesh: a 16h live watch (2026-07-24) showed a redeploy
    # ~halves the live node count, because a slow repeater heard only once since
    # the restart was reaped before its next advert. A 14h floor lets a single
    # advert carry a slow node to its next one (then cadence widens the window to
    # ~3×12h), so restarts barely dent presence. The cost — a genuine drive-through
    # transient lingers 14h instead of 3h — is negligible on a repeater-dominated
    # mesh (recency-fade + daysActive de-emphasise one-offs anyway). The registry
    # holds a node in memory for graceCeil.
    cadenceK: 3
    graceFloor: "14h"
    graceCeil: "72h"
    # Relay-topology store (docs/mesh-topology-design.md). Every received advert is
    # kept as an append-only observation (Tier 0); a maintenance tick folds those
    # into a per-link-per-day rollup (Tier 1) and prunes. spamFloor caps the raw
    # rate per (node, gateway) so a fast-adverting node can't flood Tier 0; multi-
    # gateway copies of one advert are still kept (resilience signal).
    spamFloor: "30s"
    compactionInterval: "1h"
    observationRetention: "48h" # Tier 0 raw: live-map freshness + hop re-resolution
    rollupRetention: "17520h"   # Tier 1 link history: 2 years, cheap to keep
    # Geofence for node inclusion (a node's advertised location must fall inside a
    # box). Deliberately WIDER than the Ebbetts Pass hazard area: our Sierra
    # repeaters run in power-saver mode and are quiet, so we also track the busier
    # Bay Area / Monterey mesh to confirm the source is live end-to-end. Tighten
    # to the service area once traffic is proven. Omit `bounds` to fall back to
    # the hazards.areas union.
    bounds:
      - minLatitude: 36.0    # Monterey / south Bay
        maxLatitude: 39.0    # north of the Calaveras/Tuolumne Sierra
        minLongitude: -123.0 # Pacific coast / SF
        maxLongitude: -119.5 # east of Ebbetts/Sonora passes
    # Subscriber credentials are SECRETS — injected per-environment, NEVER
    # committed (dev → .env, prod → terraform). Set them as scalar env keys:
    #   PF__GRID__MESHCORE__USERNAME
    #   PF__GRID__MESHCORE__PASSWORD
    # These apply to every broker below that omits its own username/password.
    # (A per-broker cred *inside* the brokers array can't be set via env — koanf
    # can't merge an env key onto a YAML array element — so use the scalars above.)
    brokers:
      - url: "wss://mqtt.gomesh.dev:443/mqtt"
        clientId: "data.sierragridteam.org"
        topics: ["meshcore/+/+/packets"]
        # Who runs this MQTT server — used for event provenance (an https page,
        # not the wss:// URL). A node's events attribute to the operator(s) of
        # the broker(s) that heard it.
        operator: "LetsMesh"
        operatorUrl: "https://analyzer.letsmesh.net/about"