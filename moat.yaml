name: motherlode
agent: claude
runtime: docker
# The Grid store is PostgreSQL in Docker (make db-up; make run and make test
# point at it), so no store path is set here. A leftover PF__GRID__DB_PATH
# would now stop the server: config.ValidateEnvOverrides rejects keys that no
# longer exist.
grants:
  # The SSH grant identifier is `ssh:<hostname>` — the host is part of the name,
  # so it must be `ssh:github.com`, not `ssh:github`. A bare `ssh:github` matches
  # no host: the agent proxy forwards keys only for the granted hostname, so the
  # container gets no key for github.com and `git@github.com:` fails at host-key
  # verification. `origin` is an SSH remote, so that means no fetch/push at all.
  # (The `github` grant above only covers HTTPS — api.github.com and git
  # smart-HTTP — which is why gh worked while ssh did not.)
  - github
  - ssh:github.com
dependencies:
  - git
  - go@1.27.3
  - go-extras
  # PostgreSQL for the Grid store (make db-up runs it in Docker).
  - docker:dind
  # Proto codegen. protoc is a native binary pinned here; the plugin *versions*
  # are pinned by `make proto-tools` (go install into GOPATH/bin, which the proto
  # recipe prepends to PATH) so they stay aligned with go.mod regardless of what
  # the container ships. These named plugins are a convenience fallback.
  - protoc@36.2
  - protoc-gen-go
  - protoc-gen-go-grpc
  - protoc-gen-grpc-gateway
  - protoc-gen-doc
  - sqlite3
  - mockgen
  - node@26.13.0
  - node-dev
  # Headless browser for the screenshot harnesses — the live-server layout/spacing
  # diagnosis in tools/screenshots (make site-shots) and the self-contained,
  # mocked-data UI review in web/screenshots (make site-shots-mock). This
  # dependency provides the global `playwright` CLI (/usr/bin/playwright) and the
  # Chromium + OS libraries under PLAYWRIGHT_BROWSERS_PATH (/ms-playwright); the
  # post_build_root hook below pins the browser install so it survives a version
  # bump of the npm `playwright` the web project depends on.
  - playwright
hooks:
  # Bake the Playwright browser (+ its OS libraries) into the image as root, so
  # the screenshot harnesses run with no per-container download. This mirrors the
  # `playwright` dependency above but makes the install explicit and durable:
  # PLAYWRIGHT_BROWSERS_PATH is /ms-playwright, which is root-owned, so moatuser
  # can't write it — if web/package.json's `playwright` ever pins a version whose
  # Chromium revision differs from the bundled one, `pnpm exec playwright install` as
  # the container user fails with EACCES on /ms-playwright/__dirlock. Installing
  # here (root, build time) sidesteps that. `install --with-deps` also runs the
  # apt step for Chromium's shared libraries; `chmod a+rX` keeps the tree readable
  # by moatuser (same pattern as the fonts recipe). Idempotent — a browser already
  # present is skipped. Keep the version in sync with web/package.json.
  post_build_root: |
    set -e
    npm install --global pnpm@12.18.0
    export PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    pnpm dlx playwright@1.65.0 install --with-deps chromium
    chmod -R a+rX /ms-playwright
