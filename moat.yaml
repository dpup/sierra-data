name: motherlode
agent: claude
runtime: docker
# The Grid store is PostgreSQL in Docker (make db-up; make run and make test
# point at it), so no store path is set here. A leftover PF__GRID__DB_PATH
# would now stop the server: config.ValidateEnvOverrides rejects keys that no
# longer exist.
grants:
  # The SSH grant identifier is `ssh:<hostname>` — the host is part of the name,
  # so it must be `ssh:github.com`, not `ssh:github`. A bare `ssh:github` matches
  # no host: the agent proxy forwards keys only for the granted hostname, so the
  # container gets no key for github.com and `git@github.com:` fails at host-key
  # verification. `origin` is an SSH remote, so that means no fetch/push at all.
  # (The `github` grant above only covers HTTPS — api.github.com and git
  # smart-HTTP — which is why gh worked while ssh did not.)
  - github
  - ssh:github.com
dependencies:
  - git
  - go@1.27.3
  - go-extras
  # PostgreSQL for the Grid store (make db-up runs it in Docker).
  - docker:dind
  # Proto codegen. protoc is a native binary pinned here; the plugin *versions*
  # are pinned by `make proto-tools` (go install into GOPATH/bin, which the proto
  # recipe prepends to PATH) so they stay aligned with go.mod regardless of what
  # the container ships. These named plugins are a convenience fallback.
  - protoc@36.2
  - protoc-gen-go
  - protoc-gen-go-grpc
  - protoc-gen-grpc-gateway
  - protoc-gen-doc
  - sqlite3
  - mockgen
